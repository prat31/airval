# Everything switched on (except mutually exclusive options). Used by CI lint/template/kubeconform.
config:
  baseUrl: https://airval.example.com
  cookieSecure: true
  otlpEndpoint: otel-collector.observability:4318
  env:
    AIRVAL_SECURITY_DENY_CIDRS: "10.0.0.0/8"
secrets:
  masterKey: "AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA="
bootstrap:
  adminEmail: admin@example.com
  adminPassword: change-me-please
postgresql:
  cnpg:
    enabled: true
server:
  autoscaling:
    enabled: true
worker:
  keda:
    enabled: true
ingress:
  enabled: true
  className: nginx
  hosts:
    - host: airval.example.com
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: airval-tls
      hosts: [airval.example.com]
serviceMonitor:
  enabled: true
networkPolicy:
  enabled: true
