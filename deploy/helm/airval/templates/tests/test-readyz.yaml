apiVersion: v1
kind: Pod
metadata:
  name: {{ include "airval.fullname" . }}-test-readyz
  labels:
    {{- include "airval.labels" . | nindent 4 }}
    app.kubernetes.io/component: test
  annotations:
    "helm.sh/hook": test
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  restartPolicy: Never
  automountServiceAccountToken: false
  securityContext:
    {{- toYaml .Values.podSecurityContext | nindent 4 }}
  containers:
    - name: readyz
      image: "{{ .Values.test.image.repository }}:{{ .Values.test.image.tag }}"
      # BusyBox wget has no retry flags: poll for up to 2 minutes.
      command:
        - sh
        - -c
        - |
          for i in $(seq 1 60); do
            wget -q -T 5 -O - "http://{{ include "airval.fullname" . }}:{{ .Values.server.service.port }}/readyz" && exit 0
            sleep 2
          done
          exit 1
      securityContext:
        {{- toYaml .Values.securityContext | nindent 8 }}
