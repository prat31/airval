{{- if include "airval.createSecret" . }}
{{- $name := include "airval.secretName" . }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name }}
{{- $data := dict }}
{{- if $existing }}{{- $data = $existing.data | default dict }}{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "airval.labels" . | nindent 4 }}
  annotations:
    # A hook so it exists before the pre-install/pre-upgrade migration Job, and so uninstall never deletes the
    # master key (losing it makes every stored secret unreadable).
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-10"
    "helm.sh/hook-delete-policy": before-hook-creation
type: Opaque
data:
  {{- if not .Values.secrets.existingSecret }}
  {{- $mk := .Values.secrets.masterKey | default ((index $data .Values.secrets.keys.masterKey) | default "" | b64dec) | default (randBytes 32) }}
  {{ .Values.secrets.keys.masterKey }}: {{ $mk | b64enc | quote }}
  {{- if .Values.secrets.previousKeys }}
  {{ .Values.secrets.keys.previousKeys }}: {{ .Values.secrets.previousKeys | b64enc | quote }}
  {{- end }}
  {{- if .Values.bootstrap.adminPassword }}
  {{ .Values.secrets.keys.bootstrapAdminPassword }}: {{ .Values.bootstrap.adminPassword | b64enc | quote }}
  {{- end }}
  {{- end }}
  {{- if .Values.postgresql.dev.enabled }}
  {{- $pw := (index $data "postgres-password" | default "" | b64dec) | default (randAlphaNum 24) }}
  postgres-password: {{ $pw | b64enc | quote }}
  database-url: {{ printf "postgres://airval:%s@%s:5432/airval?sslmode=disable" $pw (include "airval.devPgName" .) | b64enc | quote }}
  {{- end }}
  {{- if and (not .Values.postgresql.cnpg.enabled) (not .Values.postgresql.dev.enabled) (not .Values.postgresql.external.existingSecret) .Values.postgresql.external.url }}
  database-url: {{ .Values.postgresql.external.url | b64enc | quote }}
  {{- end }}
{{- end }}
