openapi: 3.0.3
info:
  title: airval API
  version: 1.0.0
  description: |
    The airval public API. The web UI, the `airval run` CLI and CI integrations use only this API.

    **Authentication.** Browser sessions use the `airval_session` cookie; every mutating request made with a
    session must send the CSRF token (from `GET /v1/auth/me` or the `airval_csrf` cookie) in `X-CSRF-Token`.
    Programmatic clients send an API key as `Authorization: Bearer airv_...` (no CSRF needed).

    **Pagination.** List endpoints are cursor-based: pass `cursor` (from `next_cursor`) and `limit` (1–1000, default 50).
    `next_cursor` is null on the last page.

    **Errors.** Non-2xx responses carry an `Error` body (`code`, `message`, optional `details`). Invalid input is always
    `400` with code `validation_failed` (or `bad_request` for unparseable bodies); `details.field` names the offending field.

    **Roles.** owner > admin > editor > viewer. Viewers read; editors create/edit/run; admins manage members, keys,
    secrets and notification channels; owners can delete the organization.

    Endpoints marked *(ee)* are only functional in enterprise builds (`-tags ee`); core returns 501.
    Operational endpoints `/healthz`, `/readyz` and `/metrics` (Prometheus text) are served outside `/v1`.
  license:
    name: Apache-2.0
servers:
  - url: /
security:
  - cookieAuth: []
  - bearerAuth: []
tags:
  - name: system
  - name: auth
  - name: orgs
  - name: projects
  - name: targets
  - name: datasets
  - name: evaluators
  - name: suites
  - name: runs
  - name: comparisons
  - name: review
  - name: hooks
  - name: ee
    description: Enterprise edition (build tag `ee`). Community builds answer 501.

paths:
  # ---------------------------------------------------------------- system
  /healthz:
    get:
      tags: [system]
      operationId: getHealthz
      summary: Liveness probe
      security: []
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Health" } } } }
  /readyz:
    get:
      tags: [system]
      operationId: getReadyz
      summary: Readiness probe (database + NATS)
      security: []
      responses:
        "200": { description: Ready, content: { application/json: { schema: { $ref: "#/components/schemas/Health" } } } }
        "503": { description: Not ready, content: { application/json: { schema: { $ref: "#/components/schemas/Health" } } } }
  /metrics:
    get:
      tags: [system]
      operationId: getMetrics
      summary: Prometheus metrics
      security: []
      responses:
        "200": { description: Prometheus text exposition, content: { text/plain: { schema: { type: string } } } }
  /v1/meta:
    get:
      tags: [system]
      operationId: getMeta
      summary: Server version, edition and enabled features
      security: []
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Meta" } } } }
        default: { $ref: "#/components/responses/Error" }

  # ---------------------------------------------------------------- setup & auth
  /v1/setup:
    get:
      tags: [auth]
      operationId: getSetupStatus
      summary: Whether first-run setup is still needed
      security: []
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/SetupStatus" } } } }
        default: { $ref: "#/components/responses/Error" }
    post:
      tags: [auth]
      operationId: completeSetup
      summary: Create the first owner and organization (only when no users exist); logs the owner in
      security: []
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/SetupRequest" } } }
      responses:
        "201": { description: Created, content: { application/json: { schema: { $ref: "#/components/schemas/Me" } } } }
        default: { $ref: "#/components/responses/Error" }
  /v1/auth/login:
    post:
      tags: [auth]
      operationId: login
      summary: Log in with email and password (sets the session cookie)
      security: []
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/LoginRequest" } } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Me" } } } }
        default: { $ref: "#/components/responses/Error" }
  /v1/auth/logout:
    post:
      tags: [auth]
      operationId: logout
      summary: End the current session
      responses:
        "204": { description: Logged out }
        default: { $ref: "#/components/responses/Error" }
  /v1/auth/me:
    get:
      tags: [auth]
      operationId: getMe
      summary: The authenticated principal, its organizations and the CSRF token
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Me" } } } }
        default: { $ref: "#/components/responses/Error" }
    patch:
      tags: [auth]
      operationId: updateMe
      summary: Update the current user's profile or password
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/UpdateMeRequest" } } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Me" } } } }
        default: { $ref: "#/components/responses/Error" }
  /v1/auth/oidc/{provider}/start:
    get:
      tags: [auth]
      operationId: oidcStart
      summary: Begin OIDC SSO login (ee)
      security: []
      parameters:
        - { name: provider, in: path, required: true, schema: { type: string } }
        - { name: redirect, in: query, schema: { type: string } }
      responses:
        "302": { description: Redirect to the identity provider }
        default: { $ref: "#/components/responses/Error" }
  /v1/auth/oidc/{provider}/callback:
    get:
      tags: [auth]
      operationId: oidcCallback
      summary: OIDC SSO callback (ee)
      security: []
      parameters:
        - { name: provider, in: path, required: true, schema: { type: string } }
        - { name: code, in: query, schema: { type: string } }
        - { name: state, in: query, schema: { type: string } }
      responses:
        "302": { description: Redirect into the app with a session }
        default: { $ref: "#/components/responses/Error" }

  /v1/auth/providers:
    get:
      tags: [auth]
      operationId: listAuthProviders
      summary: Single sign-on options for the sign-in page (empty in the community edition)
      security: []
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/AuthProviderList" } } } }
        default: { $ref: "#/components/responses/Error" }
  /v1/edition:
    get:
      tags: [system]
      operationId: getEdition
      summary: The running edition and its enabled enterprise features
      security: []
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Edition" } } } }
        default: { $ref: "#/components/responses/Error" }
  /v1/auth/saml/{provider}/metadata:
    get:
      tags: [ee]
      operationId: samlMetadata
      summary: SAML service provider metadata XML (ee)
      security: []
      parameters: [{ $ref: "#/components/parameters/SSOProviderSlug" }]
      responses:
        "200": { description: SP metadata, content: { application/samlmetadata+xml: { schema: { type: string } } } }
        default: { $ref: "#/components/responses/Error" }
  /v1/auth/saml/{provider}/start:
    get:
      tags: [ee]
      operationId: samlStart
      summary: Begin SAML SSO login (ee)
      security: []
      parameters:
        - { $ref: "#/components/parameters/SSOProviderSlug" }
        - { name: redirect, in: query, schema: { type: string } }
      responses:
        "302": { description: Redirect to the identity provider }
        default: { $ref: "#/components/responses/Error" }
  /v1/auth/saml/{provider}/acs:
    post:
      tags: [ee]
      operationId: samlACS
      summary: SAML assertion consumer service (HTTP-POST binding) (ee)
      security: []
      parameters: [{ $ref: "#/components/parameters/SSOProviderSlug" }]
      requestBody:
        content: { application/x-www-form-urlencoded: { schema: { type: object, properties: { SAMLResponse: { type: string }, RelayState: { type: string } } } } }
      responses:
        "302": { description: Redirect into the app with a session }
        default: { $ref: "#/components/responses/Error" }

  # ---------------------------------------------------------------- organizations
  /v1/orgs:
    get:
      tags: [orgs]
      operationId: listOrgs
      summary: Organizations the caller belongs to
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/OrganizationList" } } } }
        default: { $ref: "#/components/responses/Error" }
    post:
      tags: [orgs]
      operationId: createOrg
      summary: Create an organization (caller becomes owner)
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/OrganizationCreate" } } }
      responses:
        "201": { description: Created, content: { application/json: { schema: { $ref: "#/components/schemas/Organization" } } } }
        default: { $ref: "#/components/responses/Error" }
  /v1/orgs/{org}:
    parameters: [{ $ref: "#/components/parameters/Org" }]
    get:
      tags: [orgs]
      operationId: getOrg
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Organization" } } } }
        default: { $ref: "#/components/responses/Error" }
    patch:
      tags: [orgs]
      operationId: updateOrg
      summary: Rename an organization (admin)
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/OrganizationUpdate" } } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Organization" } } } }
        default: { $ref: "#/components/responses/Error" }
    delete:
      tags: [orgs]
      operationId: deleteOrg
      summary: Delete an organization and everything in it (owner)
      responses:
        "204": { description: Deleted }
        default: { $ref: "#/components/responses/Error" }
  /v1/orgs/{org}/members:
    parameters: [{ $ref: "#/components/parameters/Org" }]
    get:
      tags: [orgs]
      operationId: listMembers
      parameters: [{ $ref: "#/components/parameters/Cursor" }, { $ref: "#/components/parameters/Limit" }]
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/MemberList" } } } }
        default: { $ref: "#/components/responses/Error" }
    post:
      tags: [orgs]
      operationId: addMember
      summary: Add a member by email (admin). Creates the user when `password` is given and the email is new.
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/MemberCreate" } } }
      responses:
        "201": { description: Created, content: { application/json: { schema: { $ref: "#/components/schemas/Member" } } } }
        default: { $ref: "#/components/responses/Error" }
  /v1/orgs/{org}/members/{user}:
    parameters: [{ $ref: "#/components/parameters/Org" }, { $ref: "#/components/parameters/UserID" }]
    patch:
      tags: [orgs]
      operationId: updateMember
      summary: Change a member's role (admin; only owners grant owner)
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/MemberUpdate" } } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Member" } } } }
        default: { $ref: "#/components/responses/Error" }
    delete:
      tags: [orgs]
      operationId: removeMember
      summary: Remove a member (admin; members may remove themselves). The last owner cannot be removed.
      responses:
        "204": { description: Removed }
        default: { $ref: "#/components/responses/Error" }
  /v1/orgs/{org}/api-keys:
    parameters: [{ $ref: "#/components/parameters/Org" }]
    get:
      tags: [orgs]
      operationId: listApiKeys
      parameters: [{ $ref: "#/components/parameters/Cursor" }, { $ref: "#/components/parameters/Limit" }]
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/ApiKeyList" } } } }
        default: { $ref: "#/components/responses/Error" }
    post:
      tags: [orgs]
      operationId: createApiKey
      summary: Create an API key (admin). The plaintext key is returned once.
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/ApiKeyCreate" } } }
      responses:
        "201": { description: Created, content: { application/json: { schema: { $ref: "#/components/schemas/ApiKeyCreated" } } } }
        default: { $ref: "#/components/responses/Error" }
  /v1/orgs/{org}/api-keys/{key}:
    parameters: [{ $ref: "#/components/parameters/Org" }, { name: key, in: path, required: true, schema: { type: string, format: uuid } }]
    delete:
      tags: [orgs]
      operationId: deleteApiKey
      summary: Revoke an API key (admin)
      responses:
        "204": { description: Revoked }
        default: { $ref: "#/components/responses/Error" }
  /v1/orgs/{org}/secrets:
    parameters: [{ $ref: "#/components/parameters/Org" }]
    get:
      tags: [orgs]
      operationId: listSecrets
      summary: List secrets (metadata only; values are never returned)
      parameters:
        - { $ref: "#/components/parameters/Cursor" }
        - { $ref: "#/components/parameters/Limit" }
        - { name: project_id, in: query, description: "Only this project's secrets (omit for org-level secrets)", schema: { type: string, format: uuid } }
        - { name: all, in: query, description: "Org-level and every project's secrets", schema: { type: boolean } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/SecretList" } } } }
        default: { $ref: "#/components/responses/Error" }
    post:
      tags: [orgs]
      operationId: createSecret
      summary: Create a secret (admin). The value is write-only.
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/SecretCreate" } } }
      responses:
        "201": { description: Created, content: { application/json: { schema: { $ref: "#/components/schemas/Secret" } } } }
        default: { $ref: "#/components/responses/Error" }
  /v1/orgs/{org}/secrets/{secret}:
    parameters: [{ $ref: "#/components/parameters/Org" }, { name: secret, in: path, required: true, schema: { type: string, format: uuid } }]
    get:
      tags: [orgs]
      operationId: getSecret
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Secret" } } } }
        default: { $ref: "#/components/responses/Error" }
    patch:
      tags: [orgs]
      operationId: updateSecret
      summary: Replace a secret's value and/or description (admin)
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/SecretUpdate" } } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Secret" } } } }
        default: { $ref: "#/components/responses/Error" }
    delete:
      tags: [orgs]
      operationId: deleteSecret
      responses:
        "204": { description: Deleted }
        default: { $ref: "#/components/responses/Error" }
  /v1/orgs/{org}/notification-channels:
    parameters: [{ $ref: "#/components/parameters/Org" }]
    get:
      tags: [orgs]
      operationId: listNotificationChannels
      parameters: [{ $ref: "#/components/parameters/Cursor" }, { $ref: "#/components/parameters/Limit" }]
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/NotificationChannelList" } } } }
        default: { $ref: "#/components/responses/Error" }
    post:
      tags: [orgs]
      operationId: createNotificationChannel
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/NotificationChannelCreate" } } }
      responses:
        "201": { description: Created, content: { application/json: { schema: { $ref: "#/components/schemas/NotificationChannel" } } } }
        default: { $ref: "#/components/responses/Error" }
  /v1/orgs/{org}/notification-channels/{channel}:
    parameters: [{ $ref: "#/components/parameters/Org" }, { name: channel, in: path, required: true, schema: { type: string, format: uuid } }]
    get:
      tags: [orgs]
      operationId: getNotificationChannel
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/NotificationChannel" } } } }
        default: { $ref: "#/components/responses/Error" }
    patch:
      tags: [orgs]
      operationId: updateNotificationChannel
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/NotificationChannelUpdate" } } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/NotificationChannel" } } } }
        default: { $ref: "#/components/responses/Error" }
    delete:
      tags: [orgs]
      operationId: deleteNotificationChannel
      responses:
        "204": { description: Deleted }
        default: { $ref: "#/components/responses/Error" }
  /v1/orgs/{org}/notification-channels/{channel}:test:
    parameters: [{ $ref: "#/components/parameters/Org" }, { name: channel, in: path, required: true, schema: { type: string, format: uuid } }]
    post:
      tags: [orgs]
      operationId: testNotificationChannel
      summary: Send a test notification
      responses:
        "204": { description: Sent }
        default: { $ref: "#/components/responses/Error" }
  /v1/orgs/{org}/audit-log:
    parameters: [{ $ref: "#/components/parameters/Org" }]
    get:
      tags: [orgs]
      operationId: listAuditLog
      summary: Audit log, newest first (admin; every mutating call is recorded in ee)
      parameters:
        - { $ref: "#/components/parameters/Cursor" }
        - { $ref: "#/components/parameters/Limit" }
        - { name: actor, in: query, description: Case-insensitive substring of the actor, schema: { type: string } }
        - { name: action, in: query, description: "Action prefix, e.g. secret. or secret.create", schema: { type: string } }
        - { name: target, in: query, schema: { type: string } }
        - { name: from, in: query, schema: { type: string, format: date-time } }
        - { name: to, in: query, schema: { type: string, format: date-time } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/AuditEntryList" } } } }
        default: { $ref: "#/components/responses/Error" }

  # ---------------------------------------------------------------- enterprise (ee builds; core answers 501)
  /v1/orgs/{org}/sso-providers:
    parameters: [{ $ref: "#/components/parameters/Org" }]
    get:
      tags: [ee]
      operationId: listSSOProviders
      summary: SSO identity providers (admin, ee)
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/SSOProviderList" } } } }
        default: { $ref: "#/components/responses/Error" }
    post:
      tags: [ee]
      operationId: createSSOProvider
      summary: Add an OIDC or SAML identity provider (owner, ee)
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/SSOProviderCreate" } } } }
      responses:
        "201": { description: Created, content: { application/json: { schema: { $ref: "#/components/schemas/SSOProvider" } } } }
        default: { $ref: "#/components/responses/Error" }
  /v1/orgs/{org}/sso-providers/{id}:
    parameters: [{ $ref: "#/components/parameters/Org" }, { name: id, in: path, required: true, schema: { type: string, format: uuid } }]
    get:
      tags: [ee]
      operationId: getSSOProvider
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/SSOProvider" } } } }
        default: { $ref: "#/components/responses/Error" }
    patch:
      tags: [ee]
      operationId: updateSSOProvider
      summary: Update an identity provider (owner, ee). Omit client_secret to keep it.
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/SSOProviderUpdate" } } } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/SSOProvider" } } } }
        default: { $ref: "#/components/responses/Error" }
    delete:
      tags: [ee]
      operationId: deleteSSOProvider
      responses:
        "204": { description: Deleted }
        default: { $ref: "#/components/responses/Error" }
  /v1/orgs/{org}/scim-tokens:
    parameters: [{ $ref: "#/components/parameters/Org" }]
    get:
      tags: [ee]
      operationId: listSCIMTokens
      summary: SCIM bearer tokens (owner, ee)
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/SCIMTokenList" } } } }
        default: { $ref: "#/components/responses/Error" }
    post:
      tags: [ee]
      operationId: createSCIMToken
      summary: Create a SCIM bearer token (owner, ee). The plaintext token is returned once.
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [name], properties: { name: { type: string, minLength: 1, maxLength: 100 } } } } } }
      responses:
        "201": { description: Created, content: { application/json: { schema: { $ref: "#/components/schemas/SCIMTokenCreated" } } } }
        default: { $ref: "#/components/responses/Error" }
  /v1/orgs/{org}/scim-tokens/{id}:
    parameters: [{ $ref: "#/components/parameters/Org" }, { name: id, in: path, required: true, schema: { type: string, format: uuid } }]
    delete:
      tags: [ee]
      operationId: deleteSCIMToken
      responses:
        "204": { description: Revoked }
        default: { $ref: "#/components/responses/Error" }
  /v1/orgs/{org}/scim-settings:
    parameters: [{ $ref: "#/components/parameters/Org" }]
    get:
      tags: [ee]
      operationId: getSCIMSettings
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/SCIMSettings" } } } }
        default: { $ref: "#/components/responses/Error" }
    put:
      tags: [ee]
      operationId: putSCIMSettings
      summary: Default role and SCIM group → role mapping (owner, ee)
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/SCIMSettings" } } } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/SCIMSettings" } } } }
        default: { $ref: "#/components/responses/Error" }
  /v1/orgs/{org}/roles:
    parameters: [{ $ref: "#/components/parameters/Org" }]
    get:
      tags: [ee]
      operationId: listRoles
      summary: Built-in and custom roles plus the permission catalog (ee)
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/RoleCatalog" } } } }
        default: { $ref: "#/components/responses/Error" }
    post:
      tags: [ee]
      operationId: createCustomRole
      summary: Create a custom role (admin, ee)
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/CustomRoleWrite" } } } }
      responses:
        "201": { description: Created, content: { application/json: { schema: { $ref: "#/components/schemas/CustomRole" } } } }
        default: { $ref: "#/components/responses/Error" }
  /v1/orgs/{org}/roles/{id}:
    parameters: [{ $ref: "#/components/parameters/Org" }, { name: id, in: path, required: true, schema: { type: string, format: uuid } }]
    patch:
      tags: [ee]
      operationId: updateCustomRole
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/CustomRoleWrite" } } } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/CustomRole" } } } }
        default: { $ref: "#/components/responses/Error" }
    delete:
      tags: [ee]
      operationId: deleteCustomRole
      summary: Delete a custom role; its assignments are removed (admin, ee)
      responses:
        "204": { description: Deleted }
        default: { $ref: "#/components/responses/Error" }
  /v1/orgs/{org}/role-assignments:
    parameters: [{ $ref: "#/components/parameters/Org" }]
    get:
      tags: [ee]
      operationId: listRoleAssignments
