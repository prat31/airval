      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/AnnotationCreate" } } }
      responses:
        "201": { description: Created, content: { application/json: { schema: { $ref: "#/components/schemas/Annotation" } } } }
        default: { $ref: "#/components/responses/Error" }
  /v1/annotations/{annotation}:
    parameters: [{ name: annotation, in: path, required: true, schema: { type: string, format: uuid } }]
    get:
      tags: [review]
      operationId: getAnnotation
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Annotation" } } } }
        default: { $ref: "#/components/responses/Error" }
    patch:
      tags: [review]
      operationId: updateAnnotation
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/AnnotationUpdate" } } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Annotation" } } } }
        default: { $ref: "#/components/responses/Error" }
