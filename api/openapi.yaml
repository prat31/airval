        default: { $ref: "#/components/responses/Error" }
    post:
      tags: [review]
      operationId: addReviewItems
      summary: Send results to the queue (explicit result ids, or all/failed results of a run)
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/ReviewItemsAdd" } } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/CountResponse" } } } }
        default: { $ref: "#/components/responses/Error" }
  /v1/review-items/{item}:
    parameters: [{ name: item, in: path, required: true, schema: { type: string, format: uuid } }]
    get:
      tags: [review]
      operationId: getReviewItem
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/ReviewItem" } } } }
        default: { $ref: "#/components/responses/Error" }
    patch:
      tags: [review]
      operationId: updateReviewItem
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/ReviewItemUpdate" } } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/ReviewItem" } } } }
        default: { $ref: "#/components/responses/Error" }
  /v1/annotations:
    get:
      tags: [review]
      operationId: listAnnotations
      parameters:
        - { $ref: "#/components/parameters/Cursor" }
        - { $ref: "#/components/parameters/Limit" }
        - { name: project_id, in: query, schema: { type: string, format: uuid } }
        - { name: result_id, in: query, schema: { type: string, format: uuid } }
        - { name: review_item_id, in: query, schema: { type: string, format: uuid } }
        - { name: evaluator_id, in: query, schema: { type: string, format: uuid } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/AnnotationList" } } } }
        default: { $ref: "#/components/responses/Error" }
    post:
      tags: [review]
      operationId: createAnnotation
