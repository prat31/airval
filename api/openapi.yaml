        "204": { description: Deleted }
        default: { $ref: "#/components/responses/Error" }
  /v1/projects/{project}/overview:
    parameters: [{ $ref: "#/components/parameters/ProjectID" }]
    get:
      tags: [projects]
      operationId: getProjectOverview
      summary: Stat tiles for the project overview (runs, latest pass rate, average score, spend, failing gates)
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/ProjectOverview" } } } }
        default: { $ref: "#/components/responses/Error" }
  /v1/projects/{project}/trends:
    parameters: [{ $ref: "#/components/parameters/ProjectID" }]
