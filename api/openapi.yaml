  # ---------------------------------------------------------------- suites, gates, triggers
  /v1/projects/{project}/suites:
    parameters: [{ $ref: "#/components/parameters/ProjectID" }]
    get:
      tags: [suites]
      operationId: listSuites
      parameters: [{ $ref: "#/components/parameters/Cursor" }, { $ref: "#/components/parameters/Limit" }]
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/SuiteList" } } } }
        default: { $ref: "#/components/responses/Error" }
    post:
      tags: [suites]
      operationId: createSuite
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/SuiteCreate" } } }
      responses:
        "201": { description: Created, content: { application/json: { schema: { $ref: "#/components/schemas/Suite" } } } }
        default: { $ref: "#/components/responses/Error" }
  /v1/projects/{project}/suites/by-slug/{slug}:
    parameters: [{ $ref: "#/components/parameters/ProjectID" }, { name: slug, in: path, required: true, schema: { type: string } }]
    get:
      tags: [suites]
      operationId: getSuiteBySlug
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Suite" } } } }
        default: { $ref: "#/components/responses/Error" }
  /v1/suites/{suite}:
    parameters: [{ $ref: "#/components/parameters/SuiteID" }]
    get:
      tags: [suites]
      operationId: getSuite
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Suite" } } } }
        default: { $ref: "#/components/responses/Error" }
    patch:
      tags: [suites]
      operationId: updateSuite
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/SuiteUpdate" } } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Suite" } } } }
        default: { $ref: "#/components/responses/Error" }
    delete:
      tags: [suites]
      operationId: deleteSuite
      responses:
        "204": { description: Deleted }
        default: { $ref: "#/components/responses/Error" }
  /v1/suites/{suite}/gates:
    parameters: [{ $ref: "#/components/parameters/SuiteID" }]
    get:
      tags: [suites]
      operationId: listGates
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/GateList" } } } }
        default: { $ref: "#/components/responses/Error" }
    post:
      tags: [suites]
      operationId: createGate
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/GateCreate" } } }
      responses:
        "201": { description: Created, content: { application/json: { schema: { $ref: "#/components/schemas/Gate" } } } }
        default: { $ref: "#/components/responses/Error" }
  /v1/suites/{suite}/gates:validate:
    parameters: [{ $ref: "#/components/parameters/SuiteID" }]
    post:
      tags: [suites]
      operationId: validateGate
      summary: Parse and check a gate (text or AST) against the suite's evaluators without saving (live validation in the gate builder)
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/GateValidateRequest" } } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/GateValidateResult" } } } }
        default: { $ref: "#/components/responses/Error" }
  /v1/suites/{suite}/gates/{gate}:
    parameters: [{ $ref: "#/components/parameters/SuiteID" }, { name: gate, in: path, required: true, schema: { type: string, format: uuid } }]
    patch:
      tags: [suites]
      operationId: updateGate
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/GateUpdate" } } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Gate" } } } }
        default: { $ref: "#/components/responses/Error" }
    delete:
      tags: [suites]
      operationId: deleteGate
      responses:
        "204": { description: Deleted }
        default: { $ref: "#/components/responses/Error" }
  /v1/suites/{suite}/triggers:
    parameters: [{ $ref: "#/components/parameters/SuiteID" }]
    get:
      tags: [suites]
      operationId: listTriggers
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/TriggerList" } } } }
        default: { $ref: "#/components/responses/Error" }
    post:
      tags: [suites]
