      tags: [datasets]
      operationId: deleteDataset
      responses:
        "204": { description: Deleted }
        default: { $ref: "#/components/responses/Error" }
  /v1/datasets/{dataset}/examples:
    parameters: [{ $ref: "#/components/parameters/DatasetID" }]
    get:
      tags: [datasets]
      operationId: listExamples
      summary: List draft examples, or a published version's examples with `version`
      parameters:
        - { $ref: "#/components/parameters/Cursor" }
        - { $ref: "#/components/parameters/Limit" }
        - { name: version, in: query, description: Version number (omit for the draft), schema: { type: integer, minimum: 1 } }
        - { name: tag, in: query, schema: { type: string } }
        - { name: q, in: query, description: Substring search over input, expected and metadata, schema: { type: string } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/ExampleList" } } } }
        default: { $ref: "#/components/responses/Error" }
    post:
      tags: [datasets]
      operationId: upsertExamples
      summary: Bulk upsert examples into the draft (items with a known `id` get a new revision only if changed)
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/ExampleUpsertRequest" } } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/ExampleUpsertResponse" } } } }
        default: { $ref: "#/components/responses/Error" }
  /v1/datasets/{dataset}/examples:delete:
    parameters: [{ $ref: "#/components/parameters/DatasetID" }]
    post:
      tags: [datasets]
      operationId: deleteExamples
      summary: Bulk delete examples from the draft (published versions are unaffected)
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/IDList" } } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/CountResponse" } } } }
        default: { $ref: "#/components/responses/Error" }
  /v1/datasets/{dataset}/examples/{example}:
    parameters: [{ $ref: "#/components/parameters/DatasetID" }, { name: example, in: path, required: true, schema: { type: string, format: uuid } }]
    get:
      tags: [datasets]
      operationId: getExample
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Example" } } } }
        default: { $ref: "#/components/responses/Error" }
  /v1/datasets/{dataset}:import:
    parameters: [{ $ref: "#/components/parameters/DatasetID" }]
    post:
      tags: [datasets]
      operationId: importDataset
      summary: Import examples from CSV/JSONL/JSON/Parquet (multipart upload or inline text) or a public Hugging Face dataset, with column mapping.
      description: |
        Two phases. `?preview=true` parses the first rows without writing and returns `source_preview` (columns, inferred
        types, sample rows) plus a `suggested_mapping`; when a `mapping` is also sent, `preview` holds the mapped examples.
        Without `preview`, the source is streamed in batches into the dataset draft (`mode: replace` clears the draft first)
        and the result carries the counts; `publish: true` also publishes a version. Uploads are limited by
        `server.max_upload_mb`. To commit an upload, send the same file again with the mapping in `options`.
      parameters:
        - { name: preview, in: query, schema: { type: boolean, default: false } }
      requestBody:
        required: true
        content:
          application/json: { schema: { $ref: "#/components/schemas/DatasetImportRequest" } }
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary }
                options: { type: string, description: "JSON-encoded DatasetImportRequest (mapping, mode, tags, publish, source.format/limit)" }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/DatasetImportResult" } } } }
        default: { $ref: "#/components/responses/Error" }
  /v1/datasets/{dataset}:from-results:
    parameters: [{ $ref: "#/components/parameters/DatasetID" }]
    post:
      tags: [datasets]
      operationId: addExamplesFromResults
      summary: Promote run results into the dataset draft ("Add to dataset")
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/FromResultsRequest" } } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/ExampleUpsertResponse" } } } }
        default: { $ref: "#/components/responses/Error" }
  /v1/datasets/{dataset}/versions:
    parameters: [{ $ref: "#/components/parameters/DatasetID" }]
    get:
      tags: [datasets]
      operationId: listDatasetVersions
      parameters: [{ $ref: "#/components/parameters/Cursor" }, { $ref: "#/components/parameters/Limit" }]
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/DatasetVersionList" } } } }
        default: { $ref: "#/components/responses/Error" }
    post:
      tags: [datasets]
      operationId: publishDatasetVersion
      summary: Freeze the draft into a new immutable version
      requestBody:
        content: { application/json: { schema: { $ref: "#/components/schemas/PublishVersionRequest" } } }
      responses:
        "201": { description: Created, content: { application/json: { schema: { $ref: "#/components/schemas/DatasetVersion" } } } }
        default: { $ref: "#/components/responses/Error" }
  /v1/datasets/{dataset}/versions/{number}:
    parameters: [{ $ref: "#/components/parameters/DatasetID" }, { $ref: "#/components/parameters/VersionNumber" }]
    get:
      tags: [datasets]
