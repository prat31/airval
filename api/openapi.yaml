      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/TriggerCreate" } } }
      responses:
        "201": { description: Created, content: { application/json: { schema: { $ref: "#/components/schemas/TriggerCreated" } } } }
        default: { $ref: "#/components/responses/Error" }
  /v1/suites/{suite}/triggers/{trigger}:
    parameters: [{ $ref: "#/components/parameters/SuiteID" }, { $ref: "#/components/parameters/TriggerID" }]
    patch:
      tags: [suites]
      operationId: updateTrigger
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/TriggerUpdate" } } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Trigger" } } } }
        default: { $ref: "#/components/responses/Error" }
    delete:
      tags: [suites]
      operationId: deleteTrigger
      responses:
        "204": { description: Deleted }
        default: { $ref: "#/components/responses/Error" }
  /v1/suites/{suite}/triggers/{trigger}:rotate-secret:
    parameters: [{ $ref: "#/components/parameters/SuiteID" }, { $ref: "#/components/parameters/TriggerID" }]
    post:
      tags: [suites]
      operationId: rotateTriggerSecret
      summary: Generate a new webhook HMAC secret (returned once)
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/TriggerCreated" } } } }
        default: { $ref: "#/components/responses/Error" }

  # ---------------------------------------------------------------- runs
  /v1/runs:
    get:
      tags: [runs]
      operationId: listRuns
      parameters:
        - { $ref: "#/components/parameters/Cursor" }
        - { $ref: "#/components/parameters/Limit" }
        - { name: project_id, in: query, schema: { type: string, format: uuid } }
        - { name: suite_id, in: query, schema: { type: string, format: uuid } }
        - { name: target_id, in: query, schema: { type: string, format: uuid } }
        - { name: parent_run_id, in: query, schema: { type: string, format: uuid } }
        - { name: status, in: query, style: form, explode: false, schema: { type: array, items: { $ref: "#/components/schemas/RunStatus" } } }
        - { name: trigger, in: query, schema: { $ref: "#/components/schemas/TriggerKind" } }
        - { name: label, in: query, description: "key:value label filters (repeatable, all must match)", style: form, explode: true, schema: { type: array, items: { type: string } } }
        - { name: from, in: query, schema: { type: string, format: date-time } }
        - { name: to, in: query, schema: { type: string, format: date-time } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/RunList" } } } }
        default: { $ref: "#/components/responses/Error" }
    post:
      tags: [runs]
      operationId: createRun
      summary: Start a run of a suite (one run per selected target)
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/RunCreate" } } }
      responses:
        "201": { description: Created, content: { application/json: { schema: { $ref: "#/components/schemas/RunCreateResponse" } } } }
        default: { $ref: "#/components/responses/Error" }
  /v1/runs/{run}:
    parameters: [{ $ref: "#/components/parameters/RunID" }]
    get:
      tags: [runs]
      operationId: getRun
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Run" } } } }
        default: { $ref: "#/components/responses/Error" }
    patch:
      tags: [runs]
      operationId: updateRun
      summary: Rename a run or edit its labels
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/RunUpdate" } } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Run" } } } }
        default: { $ref: "#/components/responses/Error" }
    delete:
      tags: [runs]
      operationId: deleteRun
      responses:
        "204": { description: Deleted }
        default: { $ref: "#/components/responses/Error" }
  /v1/runs/{run}/results:
    parameters: [{ $ref: "#/components/parameters/RunID" }]
    get:
      tags: [runs]
      operationId: listResults
      parameters:
        - { $ref: "#/components/parameters/Cursor" }
        - { $ref: "#/components/parameters/Limit" }
        - { name: status, in: query, style: form, explode: false, schema: { type: array, items: { $ref: "#/components/schemas/ResultStatus" } } }
        - { name: evaluator_id, in: query, description: Evaluator for passed/score_min/score_max, schema: { type: string, format: uuid } }
        - { name: passed, in: query, schema: { type: boolean } }
        - { name: score_min, in: query, schema: { type: number, format: double } }
        - { name: score_max, in: query, schema: { type: number, format: double } }
        - { name: tag, in: query, schema: { type: string } }
        - { name: q, in: query, description: Substring search over output, input and error, schema: { type: string } }
        - { name: example_id, in: query, schema: { type: string, format: uuid } }
        - { name: trial, in: query, schema: { type: integer, minimum: 0 } }
        - { name: full, in: query, description: Include raw request/response, schema: { type: boolean } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/ResultList" } } } }
        default: { $ref: "#/components/responses/Error" }
  /v1/runs/{run}/results/{result}:
    parameters: [{ $ref: "#/components/parameters/RunID" }, { name: result, in: path, required: true, schema: { type: string, format: uuid } }]
    get:
      tags: [runs]
      operationId: getResult
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Result" } } } }
        default: { $ref: "#/components/responses/Error" }
  /v1/runs/{run}/aggregates:
    parameters: [{ $ref: "#/components/parameters/RunID" }]
    get:
      tags: [runs]
      operationId: listRunAggregates
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/RunAggregateList" } } } }
        default: { $ref: "#/components/responses/Error" }
  /v1/runs/{run}/events:
    parameters: [{ $ref: "#/components/parameters/RunID" }]
    get:
      tags: [runs]
      operationId: streamRunEvents
      summary: Live run events (Server-Sent Events). Each SSE message has `id` = sequence, `event` = type, `data` = RunEvent JSON. Resume with Last-Event-ID.
      parameters:
        - { name: Last-Event-ID, in: header, schema: { type: string } }
      responses:
        "200": { description: SSE stream, content: { text/event-stream: { schema: { type: string } } } }
        default: { $ref: "#/components/responses/Error" }
  /v1/runs/{run}:cancel:
    parameters: [{ $ref: "#/components/parameters/RunID" }]
    post:
      tags: [runs]
      operationId: cancelRun
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Run" } } } }
        default: { $ref: "#/components/responses/Error" }
  /v1/runs/{run}:rerun-failed:
    parameters: [{ $ref: "#/components/parameters/RunID" }]
    post:
      tags: [runs]
      operationId: rerunFailed
      summary: Create a child run covering only failed/errored results
      responses:
        "201": { description: Created, content: { application/json: { schema: { $ref: "#/components/schemas/Run" } } } }
        default: { $ref: "#/components/responses/Error" }
  /v1/runs/{run}:rescore:
    parameters: [{ $ref: "#/components/parameters/RunID" }]
    post:
      tags: [runs]
      operationId: rescoreRun
      summary: Re-evaluate existing outputs with (new) evaluators without calling the target
      requestBody:
        content: { application/json: { schema: { $ref: "#/components/schemas/RescoreRequest" } } }
      responses:
        "201": { description: Created, content: { application/json: { schema: { $ref: "#/components/schemas/Run" } } } }
        default: { $ref: "#/components/responses/Error" }

  # ---------------------------------------------------------------- comparisons
  /v1/comparisons:
    get:
      tags: [comparisons]
      operationId: compareRuns
      summary: Compare 2–4 runs (first run is the baseline)
      description: |
        Scorecard cells carry deltas vs the baseline with a paired bootstrap confidence interval; `regressions` and
        `improvements` are ranked per-example deltas for the chosen evaluator (paginate with `offset`/`limit`, totals in
        `regressions_total`/`improvements_total`); `rows` aligns every example's score across all runs (most changed first).
      parameters:
        - { name: runs, in: query, required: true, style: form, explode: false, schema: { type: array, minItems: 2, maxItems: 4, items: { type: string, format: uuid } } }
        - { name: evaluator_id, in: query, description: Evaluator used to rank regressions (default first common), schema: { type: string, format: uuid } }
        - { name: against, in: query, description: Run (one of `runs`) whose regressions/improvements and scatter are listed against the baseline (default the second run), schema: { type: string, format: uuid } }
        - { name: limit, in: query, description: Page size for regressions/improvements/rows, schema: { type: integer, default: 50, maximum: 500 } }
        - { name: offset, in: query, description: Offset into the ranked regressions/improvements/rows lists, schema: { type: integer, default: 0, minimum: 0 } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/ComparisonReport" } } } }
        default: { $ref: "#/components/responses/Error" }
  /v1/projects/{project}/comparisons:
    parameters: [{ $ref: "#/components/parameters/ProjectID" }]
    get:
      tags: [comparisons]
      operationId: listComparisons
      summary: Saved comparison views
      parameters: [{ $ref: "#/components/parameters/Cursor" }, { $ref: "#/components/parameters/Limit" }]
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/ComparisonList" } } } }
        default: { $ref: "#/components/responses/Error" }
    post:
      tags: [comparisons]
      operationId: createComparison
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/ComparisonCreate" } } }
      responses:
        "201": { description: Created, content: { application/json: { schema: { $ref: "#/components/schemas/Comparison" } } } }
        default: { $ref: "#/components/responses/Error" }
  /v1/comparisons/{comparison}:
    parameters: [{ name: comparison, in: path, required: true, schema: { type: string, format: uuid } }]
    get:
      tags: [comparisons]
      operationId: getComparison
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Comparison" } } } }
        default: { $ref: "#/components/responses/Error" }
    delete:
      tags: [comparisons]
      operationId: deleteComparison
      responses:
        "204": { description: Deleted }
        default: { $ref: "#/components/responses/Error" }

  # ---------------------------------------------------------------- review
  /v1/projects/{project}/review-queues:
    parameters: [{ $ref: "#/components/parameters/ProjectID" }]
    get:
      tags: [review]
      operationId: listReviewQueues
      parameters: [{ $ref: "#/components/parameters/Cursor" }, { $ref: "#/components/parameters/Limit" }]
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/ReviewQueueList" } } } }
