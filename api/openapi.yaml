    post:
      tags: [projects]
      operationId: createProject
      summary: Create a project (editor)
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/ProjectCreate" } } }
      responses:
        "201": { description: Created, content: { application/json: { schema: { $ref: "#/components/schemas/Project" } } } }
        default: { $ref: "#/components/responses/Error" }
  /v1/projects:sample:
    post:
      tags: [projects]
      operationId: createSampleProject
      summary: Load the sample project (editor)
      description: |
        Creates a ready-to-explore project backed by the built-in mock AI service (`/_mock/`, see `server.mock_target`):
        two targets (prod and candidate), a 1,000-example support dataset with known answers, a RAG dataset, deterministic
        evaluators, a suite with gates and two finished runs (the first is pinned as the suite baseline). Waits for both runs
        to finish (up to about a minute). 409 `mock_disabled` when the mock service is turned off.
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/SampleProjectRequest" } } }
      responses:
        "201": { description: Created, content: { application/json: { schema: { $ref: "#/components/schemas/SampleProject" } } } }
        default: { $ref: "#/components/responses/Error" }
  /v1/projects/{project}:
    parameters: [{ $ref: "#/components/parameters/ProjectID" }]
    get:
      tags: [projects]
      operationId: getProject
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Project" } } } }
        default: { $ref: "#/components/responses/Error" }
    patch:
      tags: [projects]
      operationId: updateProject
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/ProjectUpdate" } } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Project" } } } }
        default: { $ref: "#/components/responses/Error" }
    delete:
      tags: [projects]
      operationId: deleteProject
      summary: Delete a project and everything in it (admin)
