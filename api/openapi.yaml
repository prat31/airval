    post:
      tags: [review]
      operationId: createReviewQueue
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/ReviewQueueCreate" } } }
      responses:
        "201": { description: Created, content: { application/json: { schema: { $ref: "#/components/schemas/ReviewQueue" } } } }
        default: { $ref: "#/components/responses/Error" }
  /v1/review-queues/{queue}:
    parameters: [{ $ref: "#/components/parameters/QueueID" }]
    get:
      tags: [review]
      operationId: getReviewQueue
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/ReviewQueue" } } } }
        default: { $ref: "#/components/responses/Error" }
    patch:
      tags: [review]
      operationId: updateReviewQueue
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/ReviewQueueUpdate" } } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/ReviewQueue" } } } }
        default: { $ref: "#/components/responses/Error" }
    delete:
      tags: [review]
      operationId: deleteReviewQueue
      responses:
        "204": { description: Deleted }
        default: { $ref: "#/components/responses/Error" }
  /v1/review-queues/{queue}/items:
    parameters: [{ $ref: "#/components/parameters/QueueID" }]
    get:
      tags: [review]
      operationId: listReviewItems
      parameters:
        - { $ref: "#/components/parameters/Cursor" }
        - { $ref: "#/components/parameters/Limit" }
        - { name: status, in: query, style: form, explode: false, schema: { type: array, items: { $ref: "#/components/schemas/ReviewItemStatus" } } }
        - { name: assigned_to, in: query, schema: { type: string, format: uuid } }
        - { name: expand, in: query, description: Include each item's result, schema: { type: boolean } }
      responses:
