      tags: [runs]
      operationId: getTrends
      summary: Time series of run aggregates (pass rate, evaluator means, latency, cost)
      parameters:
        - { name: suite_id, in: query, schema: { type: string, format: uuid } }
        - { name: target_id, in: query, schema: { type: string, format: uuid } }
        - { name: evaluator_id, in: query, schema: { type: string, format: uuid } }
        - { name: metric, in: query, schema: { $ref: "#/components/schemas/TrendMetric" } }
        - { name: from, in: query, schema: { type: string, format: date-time } }
        - { name: to, in: query, schema: { type: string, format: date-time } }
        - { name: bucket, in: query, schema: { type: string, enum: [run, hour, day, week], default: run } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Trend" } } } }
        default: { $ref: "#/components/responses/Error" }

