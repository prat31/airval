      responses:
        "201": { description: Created, content: { application/json: { schema: { $ref: "#/components/schemas/Dataset" } } } }
        default: { $ref: "#/components/responses/Error" }
  /v1/datasets/{dataset}:
    parameters: [{ $ref: "#/components/parameters/DatasetID" }]
    get:
      tags: [datasets]
      operationId: getDataset
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Dataset" } } } }
        default: { $ref: "#/components/responses/Error" }
    patch:
      tags: [datasets]
      operationId: updateDataset
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/DatasetUpdate" } } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Dataset" } } } }
        default: { $ref: "#/components/responses/Error" }
