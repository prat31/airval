      tags: [review]
      operationId: deleteAnnotation
      responses:
        "204": { description: Deleted }
        default: { $ref: "#/components/responses/Error" }

  # ---------------------------------------------------------------- SCIM 2.0 (ee; bearer SCIM token, RFC 7643/7644)
  /scim/v2/Users:
    get:
      tags: [ee]
      operationId: scimListUsers
      summary: List users; supports `filter=userName eq "..."` / `externalId eq "..."`, startIndex, count (ee)
      security: [{ scimAuth: [] }]
      parameters:
        - { name: filter, in: query, schema: { type: string } }
        - { name: startIndex, in: query, schema: { type: integer, minimum: 1 } }
        - { name: count, in: query, schema: { type: integer, minimum: 0 } }
      responses:
        "200": { description: ListResponse, content: { application/scim+json: { schema: { type: object, additionalProperties: true } } } }
    post:
      tags: [ee]
      operationId: scimCreateUser
      security: [{ scimAuth: [] }]
      requestBody: { content: { application/scim+json: { schema: { type: object, additionalProperties: true } } } }
      responses:
        "201": { description: Created, content: { application/scim+json: { schema: { type: object, additionalProperties: true } } } }
  /scim/v2/Users/{id}:
    parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
    get:
      tags: [ee]
      operationId: scimGetUser
      security: [{ scimAuth: [] }]
      responses:
        "200": { description: User, content: { application/scim+json: { schema: { type: object, additionalProperties: true } } } }
    put:
      tags: [ee]
      operationId: scimReplaceUser
      security: [{ scimAuth: [] }]
      requestBody: { content: { application/scim+json: { schema: { type: object, additionalProperties: true } } } }
      responses:
        "200": { description: User, content: { application/scim+json: { schema: { type: object, additionalProperties: true } } } }
    patch:
      tags: [ee]
      operationId: scimPatchUser
      security: [{ scimAuth: [] }]
      requestBody: { content: { application/scim+json: { schema: { type: object, additionalProperties: true } } } }
      responses:
        "200": { description: User, content: { application/scim+json: { schema: { type: object, additionalProperties: true } } } }
    delete:
      tags: [ee]
      operationId: scimDeleteUser
      summary: Deprovision (removes the membership and signs the user out)
      security: [{ scimAuth: [] }]
      responses:
        "204": { description: Deleted }
  /scim/v2/Groups:
    get:
      tags: [ee]
      operationId: scimListGroups
      security: [{ scimAuth: [] }]
      parameters:
        - { name: filter, in: query, schema: { type: string } }
        - { name: startIndex, in: query, schema: { type: integer, minimum: 1 } }
        - { name: count, in: query, schema: { type: integer, minimum: 0 } }
      responses:
        "200": { description: ListResponse, content: { application/scim+json: { schema: { type: object, additionalProperties: true } } } }
    post:
      tags: [ee]
      operationId: scimCreateGroup
      security: [{ scimAuth: [] }]
      requestBody: { content: { application/scim+json: { schema: { type: object, additionalProperties: true } } } }
      responses:
        "201": { description: Created, content: { application/scim+json: { schema: { type: object, additionalProperties: true } } } }
  /scim/v2/Groups/{id}:
    parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
    get:
      tags: [ee]
      operationId: scimGetGroup
      security: [{ scimAuth: [] }]
      responses:
        "200": { description: Group, content: { application/scim+json: { schema: { type: object, additionalProperties: true } } } }
    put:
      tags: [ee]
      operationId: scimReplaceGroup
      security: [{ scimAuth: [] }]
      requestBody: { content: { application/scim+json: { schema: { type: object, additionalProperties: true } } } }
      responses:
        "200": { description: Group, content: { application/scim+json: { schema: { type: object, additionalProperties: true } } } }
    patch:
      tags: [ee]
      operationId: scimPatchGroup
      security: [{ scimAuth: [] }]
      requestBody: { content: { application/scim+json: { schema: { type: object, additionalProperties: true } } } }
      responses:
        "200": { description: Group, content: { application/scim+json: { schema: { type: object, additionalProperties: true } } } }
    delete:
      tags: [ee]
      operationId: scimDeleteGroup
      security: [{ scimAuth: [] }]
      responses:
        "204": { description: Deleted }

  # ---------------------------------------------------------------- inbound webhooks
  /hooks/{trigger}:
    parameters: [{ $ref: "#/components/parameters/TriggerID" }]
    post:
      tags: [hooks]
      operationId: fireWebhookTrigger
      summary: Fire a webhook trigger. Authenticated by HMAC, not by session/API key.
      description: |
        Signature: `X-Airval-Signature: sha256=<hex(hmac_sha256(secret, timestamp + "." + body))>` and
        `X-Airval-Timestamp: <unix seconds>`; requests older than 5 minutes are rejected.
      security: []
      parameters:
        - { name: X-Airval-Signature, in: header, required: true, schema: { type: string } }
        - { name: X-Airval-Timestamp, in: header, required: true, schema: { type: string } }
      requestBody:
        content: { application/json: { schema: { type: object, additionalProperties: true } } }
      responses:
        "202": { description: Accepted, content: { application/json: { schema: { $ref: "#/components/schemas/RunCreateResponse" } } } }
        default: { $ref: "#/components/responses/Error" }

components:
  securitySchemes:
    cookieAuth: { type: apiKey, in: cookie, name: airval_session }
    bearerAuth: { type: http, scheme: bearer, description: "API key: airv_..." }
    scimAuth: { type: http, scheme: bearer, description: "SCIM token (ee): airvscim_..." }

  parameters:
    Cursor: { name: cursor, in: query, description: Opaque pagination cursor, schema: { type: string } }
    Limit: { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 1000, default: 50 } }
    Org: { name: org, in: path, required: true, schema: { type: string, format: uuid } }
    UserID: { name: user, in: path, required: true, schema: { type: string, format: uuid } }
    ProjectID: { name: project, in: path, required: true, schema: { type: string, format: uuid } }
    TargetID: { name: target, in: path, required: true, schema: { type: string, format: uuid } }
    DatasetID: { name: dataset, in: path, required: true, schema: { type: string, format: uuid } }
    VersionNumber: { name: number, in: path, required: true, schema: { type: integer, minimum: 1 } }
    EvaluatorID: { name: evaluator, in: path, required: true, schema: { type: string, format: uuid } }
    SuiteID: { name: suite, in: path, required: true, schema: { type: string, format: uuid } }
    TriggerID: { name: trigger, in: path, required: true, schema: { type: string, format: uuid } }
    RunID: { name: run, in: path, required: true, schema: { type: string, format: uuid } }
    QueueID: { name: queue, in: path, required: true, schema: { type: string, format: uuid } }
    SSOProviderSlug: { name: provider, in: path, required: true, schema: { type: string } }

  responses:
    Error:
      description: Error
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }

  schemas:
    # ------------------------------------------------------------ common
    Error:
      type: object
      required: [code, message]
      properties:
        code: { type: string, description: "Machine-readable code: bad_request, unauthorized, forbidden, not_found, conflict, validation_failed, rate_limited, not_implemented, internal" }
        message: { type: string }
        request_id: { type: string }
        details: { type: object, additionalProperties: true }
    Health:
      type: object
      required: [status]
      properties:
        status: { type: string, enum: [ok, degraded, unavailable] }
        checks: { type: object, additionalProperties: { type: string } }
    Meta:
      type: object
      required: [version, edition, features]
      properties:
        version: { type: string }
        commit: { type: string }
        edition: { type: string, enum: [core, ee] }
        features:
          type: object
          required: [sso, audit_log]
          properties:
            sso: { type: boolean }
            sso_providers: { type: array, items: { type: string } }
            audit_log: { type: boolean }
            signup: { type: boolean }
            sample_project: { type: boolean, description: The built-in mock AI service is enabled, so the sample project can be loaded }
    IDList:
      type: object
      required: [ids]
      properties:
        ids: { type: array, maxItems: 10000, items: { type: string, format: uuid } }
    CountResponse:
      type: object
      required: [count]
      properties:
        count: { type: integer }
    Labels:
      type: object
      additionalProperties: { type: string }
      description: Free-form string labels such as git_sha, branch, pr
    JSONValue:
      description: Any JSON value
      x-go-type: json.RawMessage
    JSONObject:
      type: object
      additionalProperties: true
      x-go-type: json.RawMessage
    Role:
      type: string
      enum: [owner, admin, editor, viewer]

    # ------------------------------------------------------------ auth & orgs
    SetupStatus:
      type: object
      required: [needs_setup]
      properties:
        needs_setup: { type: boolean }
    SetupRequest:
      type: object
      required: [email, password, org_name]
      properties:
        email: { type: string, format: email }
        password: { type: string, minLength: 8, writeOnly: true }
        name: { type: string }
        org_name: { type: string, minLength: 1 }
        org_slug: { type: string }
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string, writeOnly: true }
    UpdateMeRequest:
      type: object
      properties:
        name: { type: string }
        avatar_url: { type: string }
        password: { type: string, minLength: 8, writeOnly: true }
        current_password: { type: string, writeOnly: true }
    User:
      type: object
      required: [id, email, name, avatar_url, created_at]
      properties:
        id: { type: string, format: uuid }
        email: { type: string }
        name: { type: string }
        avatar_url: { type: string }
        created_at: { type: string, format: date-time }
    Me:
      type: object
      required: [auth_method, orgs, csrf_token]
      properties:
        auth_method: { type: string, enum: [session, api_key] }
        user: { $ref: "#/components/schemas/User" }
        api_key: { $ref: "#/components/schemas/ApiKey" }
        orgs: { type: array, items: { $ref: "#/components/schemas/Organization" } }
        csrf_token: { type: string, description: "Send as X-CSRF-Token on mutating requests (empty for API keys)" }
    Organization:
      type: object
      required: [id, name, slug, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        slug: { type: string }
        role: { $ref: "#/components/schemas/Role" }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    OrganizationList:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/Organization" } }
        next_cursor: { type: string, nullable: true }
    OrganizationCreate:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1 }
        slug: { type: string, pattern: "^[a-z0-9][a-z0-9-]{0,62}$" }
    OrganizationUpdate:
      type: object
      properties:
        name: { type: string, minLength: 1 }
        slug: { type: string, pattern: "^[a-z0-9][a-z0-9-]{0,62}$" }
    Member:
      type: object
      required: [user, role, created_at]
      properties:
        user: { $ref: "#/components/schemas/User" }
        role: { $ref: "#/components/schemas/Role" }
        created_at: { type: string, format: date-time }
    MemberList:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/Member" } }
        next_cursor: { type: string, nullable: true }
    MemberCreate:
      type: object
      required: [email, role]
      properties:
        email: { type: string, format: email }
        role: { $ref: "#/components/schemas/Role" }
        name: { type: string }
        password: { type: string, minLength: 8, writeOnly: true, description: Initial password when creating a new user }
    MemberUpdate:
      type: object
      required: [role]
      properties:
        role: { $ref: "#/components/schemas/Role" }
    ApiKey:
      type: object
      required: [id, org_id, name, prefix, role, created_at]
      properties:
        id: { type: string, format: uuid }
        org_id: { type: string, format: uuid }
        project_id: { type: string, format: uuid, nullable: true, description: When set the key only reaches this project }
        name: { type: string }
        prefix: { type: string, description: First characters of the key, for identification }
        role: { $ref: "#/components/schemas/Role" }
        created_by: { type: string, format: uuid, nullable: true }
        last_used_at: { type: string, format: date-time, nullable: true }
        expires_at: { type: string, format: date-time, nullable: true }
        created_at: { type: string, format: date-time }
    ApiKeyList:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/ApiKey" } }
        next_cursor: { type: string, nullable: true }
    ApiKeyCreate:
      type: object
      required: [name, role]
      properties:
        name: { type: string, minLength: 1 }
        role: { $ref: "#/components/schemas/Role" }
        project_id: { type: string, format: uuid }
        expires_at: { type: string, format: date-time }
    ApiKeyCreated:
      allOf:
        - $ref: "#/components/schemas/ApiKey"
        - type: object
          required: [key]
          properties:
            key: { type: string, description: "The full key (airv_...). Shown only once." }
    Secret:
      type: object
      required: [id, org_id, name, description, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        org_id: { type: string, format: uuid }
        project_id: { type: string, format: uuid, nullable: true }
        name: { type: string, description: "Referenced in templates as {{ secret \"NAME\" }}" }
        description: { type: string }
        key_version: { type: integer }
        created_by: { type: string, format: uuid, nullable: true }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    SecretList:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/Secret" } }
        next_cursor: { type: string, nullable: true }
    SecretCreate:
      type: object
      required: [name, value]
      properties:
        name: { type: string, pattern: "^[A-Za-z_][A-Za-z0-9_]{0,127}$" }
        value: { type: string, writeOnly: true }
        description: { type: string }
        project_id: { type: string, format: uuid }
    SecretUpdate:
      type: object
      properties:
        value: { type: string, writeOnly: true }
        description: { type: string }
    NotificationEvent:
      type: string
      enum: [run.finished, run.failed, run.errored, gate.failed]
    NotificationChannelKind:
      type: string
      enum: [slack, webhook, email]
    NotificationChannelConfig:
      type: object
      additionalProperties: true
      x-go-type: json.RawMessage
      description: Kind-specific settings. Values may reference secrets with {{ secret "NAME" }}.
      properties:
        url: { type: string, description: "slack: incoming webhook URL; webhook: destination URL" }
        headers: { type: object, additionalProperties: { type: string } }
        signing_secret: { type: string, description: "webhook: secret name used to sign payloads (HMAC-SHA256)" }
        recipients: { type: array, items: { type: string, format: email } }
        subject_prefix: { type: string }
        project_ids: { type: array, items: { type: string, format: uuid }, description: Only notify for these projects (empty = all) }
    NotificationChannel:
      type: object
      required: [id, org_id, name, kind, config, events, enabled, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        org_id: { type: string, format: uuid }
        name: { type: string }
        kind: { $ref: "#/components/schemas/NotificationChannelKind" }
        config: { $ref: "#/components/schemas/NotificationChannelConfig" }
        events: { type: array, items: { $ref: "#/components/schemas/NotificationEvent" } }
        enabled: { type: boolean }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    NotificationChannelList:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/NotificationChannel" } }
        next_cursor: { type: string, nullable: true }
    NotificationChannelCreate:
      type: object
      required: [name, kind, config]
      properties:
        name: { type: string, minLength: 1 }
        kind: { $ref: "#/components/schemas/NotificationChannelKind" }
        config: { $ref: "#/components/schemas/NotificationChannelConfig" }
        events: { type: array, items: { $ref: "#/components/schemas/NotificationEvent" } }
        enabled: { type: boolean, default: true }
    NotificationChannelUpdate:
      type: object
      properties:
        name: { type: string, minLength: 1 }
        config: { $ref: "#/components/schemas/NotificationChannelConfig" }
        events: { type: array, items: { $ref: "#/components/schemas/NotificationEvent" } }
        enabled: { type: boolean }
    AuditEntry:
      type: object
      required: [id, org_id, actor, action, target, at]
      properties:
        id: { type: string, format: uuid }
        org_id: { type: string, format: uuid }
        actor_id: { type: string, format: uuid, nullable: true }
        actor: { type: string }
        action: { type: string }
        target: { type: string }
        diff: { $ref: "#/components/schemas/JSONValue" }
        ip: { type: string }
        user_agent: { type: string }
        request_id: { type: string }
        status: { type: integer, description: HTTP status of the call (0 = not an API call) }
        at: { type: string, format: date-time }
    AuditEntryList:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/AuditEntry" } }
        next_cursor: { type: string, nullable: true }

    # ------------------------------------------------------------ projects
    ProjectSettings:
      type: object
      properties:
        retention_days: { type: integer, minimum: 0, description: Delete runs older than this (0 = keep forever) }
        default_target_id: { type: string, format: uuid }
    Project:
      type: object
      required: [id, org_id, name, slug, description, color, icon, settings, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        org_id: { type: string, format: uuid }
        name: { type: string }
        slug: { type: string }
        description: { type: string }
        color: { type: string, description: Chart categorical slot name or empty }
        icon: { type: string, description: Lucide icon name }
        settings: { $ref: "#/components/schemas/ProjectSettings" }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    ProjectList:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/Project" } }
        next_cursor: { type: string, nullable: true }
    SampleProjectRequest:
      type: object
      required: [org_id]
      properties:
        org_id: { type: string, format: uuid }
        name: { type: string, minLength: 1, description: "Project name (default: Sample · Support Copilot)" }
    SampleProject:
      type: object
      required: [project, suite_id, target_ids, dataset_ids, run_ids]
      properties:
        project: { $ref: "#/components/schemas/Project" }
        suite_id: { type: string, format: uuid }
        target_ids: { type: array, items: { type: string, format: uuid } }
        dataset_ids: { type: array, items: { type: string, format: uuid } }
        run_ids: { type: array, items: { type: string, format: uuid }, description: Baseline run first }
    ProjectCreate:
      type: object
      required: [org_id, name]
      properties:
        org_id: { type: string, format: uuid }
        name: { type: string, minLength: 1 }
        slug: { type: string, pattern: "^[a-z0-9][a-z0-9-]{0,62}$" }
        description: { type: string }
        color: { type: string }
        icon: { type: string }
        settings: { $ref: "#/components/schemas/ProjectSettings" }
    ProjectUpdate:
      type: object
      properties:
        name: { type: string, minLength: 1 }
        slug: { type: string, pattern: "^[a-z0-9][a-z0-9-]{0,62}$" }
        description: { type: string }
        color: { type: string }
        icon: { type: string }
        settings: { $ref: "#/components/schemas/ProjectSettings" }

    # ------------------------------------------------------------ targets
    TargetKind:
      type: string
      enum: [http, openai, anthropic, bedrock, vertex, agent]
    TargetConfig:
      type: object
      additionalProperties: true
      x-go-type: json.RawMessage
      description: |
        Versioned target configuration, flat and specific to `kind` (see HttpTargetConfig, OpenAITargetConfig,
        AnthropicTargetConfig, BedrockTargetConfig, VertexTargetConfig; `agent` takes the HttpTargetConfig fields and needs
        a `response.trace` or `response.tool_calls` mapping). The server validates it strictly on create/update
        (unknown fields are rejected) and returns 400 `validation_failed` with `details.field`.
        Strings are Go templates: `{{ .input.question }}`, `{{ secret "KEY" }}`. Secret values never appear in test output.
    HttpTargetConfig:
      type: object
      required: [url]
      properties:
        method: { type: string, enum: [GET, POST, PUT, PATCH, DELETE], default: POST }
        url: { type: string }
        headers: { type: object, additionalProperties: { type: string } }
        body: { type: string, description: Request body template (usually JSON) }
        expect_status: { type: array, items: { type: integer }, description: Accepted status codes (default any 2xx) }
        response: { $ref: "#/components/schemas/ResponseMapping" }
        stream:
          type: object
          required: [mode, delta_path]
          properties:
            mode: { type: string, enum: [sse, ndjson] }
            delta_path: { type: string }
            done_sentinel: { type: string }
            event: { type: string }
        session: { type: object, required: [path], properties: { path: { type: string } } }
        timeout_ms: { type: integer, default: 60000 }
        max_response_bytes: { type: integer, format: int64 }
        max_concurrency: { type: integer }
        tls: { $ref: "#/components/schemas/TLSConfig" }
    ResponseMapping:
      type: object
      description: JSONPath expressions applied to the response body
      properties:
        output: { type: string, example: "$.choices[0].message.content" }
        output_json: { type: string }
        context: { type: string, description: "Path to an array of retrieved passages" }
        tool_calls:
          type: object
          required: [path]
          properties: { path: { type: string }, id: { type: string }, name: { type: string }, arguments: { type: string }, result: { type: string } }
        trace:
          type: object
          required: [path]
          properties: { path: { type: string }, kind: { type: string }, name: { type: string }, input: { type: string }, output: { type: string }, duration_ms: { type: string } }
        input_tokens: { type: string }
        output_tokens: { type: string }
        cost_usd: { type: string }
    TLSConfig:
      type: object
      description: PEM fields are templates, e.g. `{{ secret "CLIENT_CERT" }}`
      properties:
        ca_cert: { type: string }
        client_cert: { type: string }
        client_key: { type: string }
        server_name: { type: string }
        insecure_skip_verify: { type: boolean }
    LLMSamplingConfig:
      type: object
      required: [model]
      properties:
        model: { type: string }
        system_prompt: { type: string }
        user_template: { type: string, description: "User message template (default: the lone string in the input, else its JSON)" }
        temperature: { type: number, format: double }
        max_tokens: { type: integer }
        pricing: { type: object, properties: { input_per_1m: { type: number, format: double }, output_per_1m: { type: number, format: double } } }
        timeout_ms: { type: integer }
        max_response_bytes: { type: integer, format: int64 }
        max_concurrency: { type: integer }
        tls: { $ref: "#/components/schemas/TLSConfig" }
    OpenAITargetConfig:
      allOf:
        - $ref: "#/components/schemas/LLMSamplingConfig"
        - type: object
          properties:
            base_url: { type: string, default: "https://api.openai.com/v1" }
            path: { type: string, default: /chat/completions }
            api_key: { type: string, description: 'Template, e.g. {{ secret "OPENAI_KEY" }}' }
            auth_header: { type: string }
            headers: { type: object, additionalProperties: { type: string } }
            query: { type: object, additionalProperties: { type: string } }
            max_tokens_param: { type: string }
            tools: { type: array, items: { $ref: "#/components/schemas/JSONObject" } }
            tool_choice: { $ref: "#/components/schemas/JSONValue" }
            response_format: { $ref: "#/components/schemas/JSONObject" }
            extra_body: { $ref: "#/components/schemas/JSONObject" }
            stream: { type: boolean }
    AnthropicTargetConfig:
      allOf:
        - $ref: "#/components/schemas/LLMSamplingConfig"
        - type: object
          properties:
            base_url: { type: string, default: "https://api.anthropic.com" }
            api_key: { type: string }
            anthropic_version: { type: string }
            anthropic_beta: { type: string }
            headers: { type: object, additionalProperties: { type: string } }
            tools: { type: array, items: { $ref: "#/components/schemas/JSONObject" } }
            tool_choice: { $ref: "#/components/schemas/JSONValue" }
            extra_body: { $ref: "#/components/schemas/JSONObject" }
            stream: { type: boolean }
    BedrockTargetConfig:
      allOf:
        - $ref: "#/components/schemas/LLMSamplingConfig"
        - type: object
          required: [region, access_key_id, secret_access_key]
          properties:
            region: { type: string }
            endpoint: { type: string }
            access_key_id: { type: string }
            secret_access_key: { type: string }
            session_token: { type: string }
            tool_config: { $ref: "#/components/schemas/JSONObject" }
            additional_model_request_fields: { $ref: "#/components/schemas/JSONObject" }
            extra_body: { $ref: "#/components/schemas/JSONObject" }
    VertexTargetConfig:
      allOf:
        - $ref: "#/components/schemas/LLMSamplingConfig"
        - type: object
          properties:
            base_url: { type: string }
            project_id: { type: string, description: Set for Vertex AI; omit for the Gemini API }
            location: { type: string }
            api_key: { type: string }
            access_token: { type: string }
            tools: { type: array, items: { $ref: "#/components/schemas/JSONObject" } }
            extra_body: { $ref: "#/components/schemas/JSONObject" }
    SimulatorConfig:
      type: object
      required: [provider, model]
      description: |
        The LLM that plays the user in simulated conversations. Multi-turn state is carried by the target config
        itself: templates see `.messages`, `.message`, `.turn` and `.session` (see `session.path`).
      properties:
        provider: { type: string, enum: [openai, anthropic, vertex] }
        model: { type: string, minLength: 1 }
        secret: { type: string, description: Name of the Secret holding the provider API key }
        base_url: { type: string, description: "Override the provider endpoint (OpenAI-compatible gateways, self-hosted models)" }
    TargetLimits:
      type: object
      additionalProperties: true
      properties:
        max_concurrency: { type: integer, minimum: 1 }
        rpm: { type: integer, minimum: 0, description: Requests per minute (0 = unlimited) }
        tpm: { type: integer, minimum: 0, description: Tokens per minute (0 = unlimited) }
        adaptive: { type: boolean, default: true, description: AIMD backoff on 429/5xx }
    CachePolicy:
      type: object
      additionalProperties: true
      properties:
        enabled: { type: boolean }
        ttl_seconds: { type: integer }
    Target:
      type: object
      required: [id, org_id, project_id, name, description, kind, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        org_id: { type: string, format: uuid }
        project_id: { type: string, format: uuid }
        name: { type: string }
        description: { type: string }
        kind: { $ref: "#/components/schemas/TargetKind" }
        current_version: { $ref: "#/components/schemas/TargetVersion" }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    TargetList:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/Target" } }
        next_cursor: { type: string, nullable: true }
    TargetVersion:
      type: object
      required: [id, target_id, number, config, created_at]
      properties:
        id: { type: string, format: uuid }
        target_id: { type: string, format: uuid }
        number: { type: integer }
        config: { $ref: "#/components/schemas/TargetConfig" }
        created_by: { type: string, format: uuid, nullable: true }
        created_at: { type: string, format: date-time }
    TargetVersionList:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/TargetVersion" } }
        next_cursor: { type: string, nullable: true }
    TargetCreate:
      type: object
      required: [name, kind, config]
      properties:
        name: { type: string, minLength: 1 }
        description: { type: string }
        kind: { $ref: "#/components/schemas/TargetKind" }
        config: { $ref: "#/components/schemas/TargetConfig" }
    TargetUpdate:
      type: object
      properties:
        name: { type: string, minLength: 1 }
        description: { type: string }
        config: { $ref: "#/components/schemas/TargetConfig" }
    TargetTestRequest:
      type: object
      properties:
        example: { $ref: "#/components/schemas/ExampleData" }
        dataset_id: { type: string, format: uuid, description: Use the first example of this dataset (draft) as the sample }
        variables: { type: object, additionalProperties: { type: string } }
        simulator: { $ref: "#/components/schemas/SimulatorConfig" }
    TargetDraftTestRequest:
      type: object
      required: [kind, config]
      properties:
        kind: { $ref: "#/components/schemas/TargetKind" }
        config: { $ref: "#/components/schemas/TargetConfig" }
        example: { $ref: "#/components/schemas/ExampleData" }
        dataset_id: { type: string, format: uuid }
        variables: { type: object, additionalProperties: { type: string } }
        simulator: { $ref: "#/components/schemas/SimulatorConfig" }
    TargetTestResult:
      type: object
      required: [ok, latency_ms]
      properties:
        ok: { type: boolean }
        error: { type: string }
        error_class: { type: string, description: "permanent | transient | rate_limited | ... (empty when ok)" }
        retry_after_ms: { type: integer, format: int64 }
        latency_ms: { type: number, format: double }
        request: { $ref: "#/components/schemas/JSONValue" }
        raw_response: { $ref: "#/components/schemas/JSONValue" }
        status_code: { type: integer }
        response: { $ref: "#/components/schemas/TargetResponse" }
        mapping:
          type: array
          description: One row per configured response JSONPath, showing whether it matched
          items:
            type: object
            required: [field, path, matched]
            properties:
              field: { type: string }
              path: { type: string }
              matched: { type: boolean }
              value: { $ref: "#/components/schemas/JSONValue" }
    TargetResponse:
      type: object
      description: What a target returned for one example (mirrors the execution pipeline's Response)
      required: [output]
      properties:
        output: { type: string }
        output_json: { $ref: "#/components/schemas/JSONValue" }
        context: { type: array, items: { type: string } }
        tool_calls: { type: array, items: { $ref: "#/components/schemas/ToolCall" } }
        trace: { type: array, items: { $ref: "#/components/schemas/TraceStep" } }
        transcript: { type: array, items: { $ref: "#/components/schemas/Message" } }
        usage: { $ref: "#/components/schemas/Usage" }
        cost_usd: { type: number, format: double }
        latency_ms: { type: number, format: double }
        ttft_ms: { type: number, format: double }
        cached: { type: boolean }
    ToolCall:
      type: object
      required: [name]
      properties:
        id: { type: string }
        name: { type: string }
        arguments: { $ref: "#/components/schemas/JSONValue" }
        result: { $ref: "#/components/schemas/JSONValue" }
    TraceStep:
      type: object
      required: [kind]
      properties:
        kind: { type: string, enum: [llm, tool, retrieval, custom] }
        name: { type: string }
        input: { $ref: "#/components/schemas/JSONValue" }
        output: { $ref: "#/components/schemas/JSONValue" }
        started_at: { type: string, format: date-time }
        duration: { type: integer, format: int64, description: Nanoseconds }
    Message:
      type: object
      required: [role, content]
      properties:
        role: { type: string, enum: [user, assistant, system, tool] }
        content: { type: string }
        tool_calls: { type: array, items: { $ref: "#/components/schemas/ToolCall" } }
    Usage:
      type: object
      required: [input_tokens, output_tokens]
      properties:
        input_tokens: { type: integer }
        output_tokens: { type: integer }

    # ------------------------------------------------------------ datasets
    Dataset:
      type: object
      required: [id, org_id, project_id, name, description, example_count, has_draft_changes, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        org_id: { type: string, format: uuid }
        project_id: { type: string, format: uuid }
        name: { type: string }
        description: { type: string }
        schema: { $ref: "#/components/schemas/DatasetSchema" }
        example_count: { type: integer, description: Examples in the draft }
        has_draft_changes: { type: boolean, description: The draft differs from the latest published version }
        latest_version: { $ref: "#/components/schemas/DatasetVersionRef" }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time, description: Last draft change }
    DatasetSchema:
      type: object
      additionalProperties: true
      x-go-type: json.RawMessage
      description: Optional column hints for the editor
      properties:
        input_fields: { type: array, items: { type: string } }
        expected_type: { type: string, enum: [text, json] }
    DatasetVersionRef:
      type: object
      required: [id, number, created_at]
      properties:
        id: { type: string, format: uuid }
        number: { type: integer }
        created_at: { type: string, format: date-time }
    DatasetList:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/Dataset" } }
        next_cursor: { type: string, nullable: true }
    DatasetCreate:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1 }
        description: { type: string }
        schema: { $ref: "#/components/schemas/DatasetSchema" }
    DatasetUpdate:
      type: object
      properties:
        name: { type: string, minLength: 1 }
        description: { type: string }
        schema: { $ref: "#/components/schemas/DatasetSchema" }
    Conversation:
      type: object
      description: Multi-turn script (turns) or simulated user (simulation); exactly one is set
      properties:
        turns: { type: array, items: { $ref: "#/components/schemas/Turn" } }
        simulation: { $ref: "#/components/schemas/Simulation" }
    Turn:
      type: object
      required: [role, content]
      properties:
        role: { type: string, enum: [user, assistant, system, tool] }
        content: { type: string }
        expected: { type: string }
    Simulation:
      type: object
      required: [persona, goal, max_turns]
      properties:
        persona: { type: string }
        goal: { type: string }
        first_message: { type: string }
        max_turns: { type: integer, minimum: 1, maximum: 50 }
        stop_condition: { type: string }
    ExampleData:
      type: object
      properties:
        id: { type: string, format: uuid, description: "Upsert: existing example id (omit to create)" }
        input:
          type: object
          additionalProperties: true
          x-go-type: json.RawMessage
          description: Template variables, e.g. {"question":"..."}
        expected: { $ref: "#/components/schemas/JSONValue" }
        context: { type: array, items: { type: string } }
        metadata: { $ref: "#/components/schemas/JSONObject" }
        tags: { type: array, items: { type: string } }
        conversation:
          allOf: [{ $ref: "#/components/schemas/Conversation" }]
          x-go-type: json.RawMessage
    Example:
      type: object
      required: [id, dataset_id, revision_id, input, tags, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        dataset_id: { type: string, format: uuid }
        revision_id: { type: string, format: uuid }
        input: { $ref: "#/components/schemas/JSONObject" }
        expected: { $ref: "#/components/schemas/JSONValue" }
        context: { type: array, items: { type: string } }
        metadata: { $ref: "#/components/schemas/JSONObject" }
        tags: { type: array, items: { type: string } }
        conversation:
          allOf: [{ $ref: "#/components/schemas/Conversation" }]
          x-go-type: json.RawMessage
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    ExampleList:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/Example" } }
        next_cursor: { type: string, nullable: true }
    ExampleUpsertRequest:
      type: object
      required: [examples]
      properties:
        examples: { type: array, minItems: 1, maxItems: 10000, items: { $ref: "#/components/schemas/ExampleData" } }
    ExampleUpsertResponse:
      type: object
      required: [count, examples]
      properties:
        count: { type: integer }
        examples: { type: array, items: { $ref: "#/components/schemas/Example" } }
    FromResultsRequest:
      type: object
      required: [result_ids]
      properties:
        result_ids: { type: array, minItems: 1, maxItems: 1000, items: { type: string, format: uuid } }
        use_output_as_expected: { type: boolean, default: false, description: Store the run output as the expected value }
        tags: { type: array, items: { type: string } }
    DatasetImportFormat:
      type: string
      enum: [csv, jsonl, json, parquet]
    ColumnMapping:
      type: object
      description: Maps source columns to example fields (the importer's mapping, verbatim).
      properties:
        input_columns: { type: object, additionalProperties: { type: string }, description: "source column -> input key" }
        whole_row_as_input: { type: boolean, description: Put every column not mapped elsewhere into input }
        id_column: { type: string }
        expected_column: { type: string }
        context_column: { type: string }
        context_delimiter: { type: string }
        tags_column: { type: string }
        tags_delimiter: { type: string }
        metadata_columns: { type: array, items: { type: string } }
        conversation_column: { type: string, description: "OpenAI-style messages array" }
    DatasetImportRequest:
      type: object
      properties:
        source:
          type: object
          properties:
            kind: { type: string, enum: [upload, huggingface, inline] }
            format: { $ref: "#/components/schemas/DatasetImportFormat" }
            data: { type: string, description: "inline: pasted CSV/JSONL/JSON" }
            hf_repo: { type: string, description: "huggingface: repo id, e.g. openai/gsm8k" }
            hf_config: { type: string }
            hf_split: { type: string, default: train }
            limit: { type: integer, description: Import at most this many rows }
        mapping: { $ref: "#/components/schemas/ColumnMapping" }
        mode: { type: string, enum: [append, replace], default: append }
        tags: { type: array, items: { type: string }, description: Tags added to every imported example }
        preview: { type: boolean, description: Same as the `preview` query parameter }
        publish: { type: boolean, description: Publish a version after importing }
    DatasetPreview:
      type: object
      required: [format, columns, rows, total_estimate, total_exact]
      properties:
        format: { type: string }
        columns:
          type: array
          items:
            type: object
            required: [name, inferred_type, sample_values]
            properties:
              name: { type: string }
              inferred_type: { type: string, description: "string|int|float|bool|array|object|messages|null" }
              sample_values: { type: array, items: { $ref: "#/components/schemas/JSONValue" } }
        rows: { type: array, items: { type: array, items: { $ref: "#/components/schemas/JSONValue" } }, description: Aligned with columns }
        total_estimate: { type: integer, format: int64, description: "-1 when unknown" }
        total_exact: { type: boolean }
        row_errors: { type: array, items: { $ref: "#/components/schemas/ImportRowError" } }
    ImportRowError:
      type: object
      required: [row, message]
      properties: { row: { type: integer }, message: { type: string } }
    DatasetImportResult:
      type: object
      required: [count, total, failed]
      properties:
        count: { type: integer, description: Examples written (0 for preview) }
        total: { type: integer, description: Source rows read }
        failed: { type: integer, description: Rows skipped }
        columns: { type: array, items: { type: string } }
        preview: { type: array, items: { $ref: "#/components/schemas/ExampleData" }, description: Mapped examples (preview with a mapping) }
        source_preview: { $ref: "#/components/schemas/DatasetPreview" }
        suggested_mapping: { $ref: "#/components/schemas/ColumnMapping" }
        errors: { type: array, items: { $ref: "#/components/schemas/ImportRowError" } }
        errors_truncated: { type: boolean }
        version: { $ref: "#/components/schemas/DatasetVersion" }
    DatasetVersion:
      type: object
      required: [id, dataset_id, number, note, example_count, created_at]
      properties:
        id: { type: string, format: uuid }
        dataset_id: { type: string, format: uuid }
        number: { type: integer }
        note: { type: string }
        example_count: { type: integer }
        created_by: { type: string, format: uuid, nullable: true }
        created_at: { type: string, format: date-time }
    DatasetVersionList:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/DatasetVersion" } }
        next_cursor: { type: string, nullable: true }
    PublishVersionRequest:
      type: object
      properties:
        note: { type: string }

    # ------------------------------------------------------------ evaluators
    EvaluatorKind:
      type: string
      enum:
        [equals, contains, regex, starts_with, ends_with, is_json, json_schema, jsonpath_equals, numeric_close,
         levenshtein, rouge_l, bleu, length, latency_ms, cost_usd, tokens, tool_called, tool_sequence, no_pii, refusal,
         embedding_similarity, llm_rubric, correctness, faithfulness, groundedness, answer_relevance, context_relevance,
         context_recall, hallucination, toxicity, bias, conciseness, helpfulness, conversation_goal_completion,
         conversation_coherence, tool_use_correctness, pairwise, human]
    EvaluatorCategory:
      type: string
      enum: [deterministic, model, human]
    EvaluatorConfig:
      type: object
      additionalProperties: true
      x-go-type: json.RawMessage
      description: Kind-specific options, validated strictly per kind; the exact fields and types come from GET /v1/evaluators/catalog (`config_schema`). Judges take flat `provider`, `model`, `secret`. The properties below are illustrative.
      properties:
        field: { type: string, description: "What to score: output (default), output_json, context, transcript, or a JSONPath into the output" }
        value: { $ref: "#/components/schemas/JSONValue" }
        values: { type: array, items: { type: string } }
        mode: { type: string, enum: [any, all, none] }
        case_sensitive: { type: boolean }
        pattern: { type: string }
        schema: { $ref: "#/components/schemas/JSONObject" }
        path: { type: string, description: JSONPath }
        tolerance: { type: number, format: double }
        min: { type: number, format: double }
        max: { type: number, format: double }
        unit: { type: string, enum: [chars, words, tokens] }
        tool_name: { type: string }
        tool_args: { $ref: "#/components/schemas/JSONObject" }
        sequence: { type: array, items: { type: string } }
        ordered: { type: boolean }
        pii_types: { type: array, items: { type: string, enum: [email, phone, credit_card, ssn, ip, iban, address] } }
        phrases: { type: array, items: { type: string } }
        judge: { $ref: "#/components/schemas/JudgeModelConfig" }
        rubric: { type: string, description: "llm_rubric: grading criteria" }
        prompt: { type: string, description: Override the judge prompt template }
        scale: { type: object, properties: { min: { type: number, format: double }, max: { type: number, format: double } } }
        embedding: { $ref: "#/components/schemas/JudgeModelConfig" }
        review: { $ref: "#/components/schemas/ReviewQueueConfig" }
    JudgeModelConfig:
      type: object
      additionalProperties: true
      properties:
        provider: { type: string, enum: [openai, anthropic, bedrock, vertex] }
        model: { type: string }
        base_url: { type: string }
        api_key_secret: { type: string }
        temperature: { type: number, format: double, default: 0 }
        samples: { type: integer, minimum: 1, maximum: 9, default: 1, description: N-sample voting }
        aggregation: { type: string, enum: [median, mean, majority], default: median }
        use_logprobs: { type: boolean }
        cache: { type: boolean, default: true }
        max_concurrency: { type: integer }
        rpm: { type: integer }
    Evaluator:
      type: object
      required: [id, org_id, project_id, name, description, kind, category, config, version, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        org_id: { type: string, format: uuid }
        project_id: { type: string, format: uuid }
        name: { type: string }
        description: { type: string }
        kind: { $ref: "#/components/schemas/EvaluatorKind" }
        category: { $ref: "#/components/schemas/EvaluatorCategory" }
        config: { $ref: "#/components/schemas/EvaluatorConfig" }
        version: { type: integer }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    EvaluatorList:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/Evaluator" } }
        next_cursor: { type: string, nullable: true }
    EvaluatorCreate:
      type: object
      required: [name, kind]
      properties:
        name: { type: string, minLength: 1 }
        description: { type: string }
        kind: { $ref: "#/components/schemas/EvaluatorKind" }
        config: { $ref: "#/components/schemas/EvaluatorConfig" }
    EvaluatorUpdate:
      type: object
      properties:
        name: { type: string, minLength: 1 }
        description: { type: string }
        kind: { $ref: "#/components/schemas/EvaluatorKind" }
        config: { $ref: "#/components/schemas/EvaluatorConfig" }
    EvaluatorPreviewRequest:
      type: object
      required: [kind, response]
      properties:
        project_id: { type: string, format: uuid, description: Project whose secrets judges may use }
        kind: { $ref: "#/components/schemas/EvaluatorKind" }
        config: { $ref: "#/components/schemas/EvaluatorConfig" }
        example: { $ref: "#/components/schemas/ExampleData" }
        response: { $ref: "#/components/schemas/TargetResponse" }
    EvaluatorCatalog:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/EvaluatorKindInfo" } }
    EvaluatorKindInfo:
      type: object
      required: [kind, name, category, group, description, cost, default_threshold, config_schema, apply_to]
      properties:
        kind: { type: string }
        name: { type: string }
        category: { type: string, enum: [deterministic, model, human] }
        group: { type: string }
        description: { type: string }
        cost: { type: string, enum: [free, model, human], description: "free: pure computation; model: calls an LLM or embedding model; human: waits for a reviewer" }
        default_threshold: { type: number, format: double }
        config_schema: { $ref: "#/components/schemas/JSONObject" }
        apply_to: { type: array, items: { $ref: "#/components/schemas/ApplyTo" } }
        requires: { type: array, items: { type: string } }
        prompt_version: { type: string }
        prompt: { type: string, description: Judge prompt template shown to users }
    EvaluatorAgreement:
      type: object
      required: [evaluator_id, n]
      properties:
        evaluator_id: { type: string, format: uuid }
        n: { type: integer, description: Results with both a score and a human annotation }
        n_binary: { type: integer, description: Pairs with a pass/fail verdict on both sides }
        n_numeric: { type: integer, description: Pairs with a numeric value on both sides }
        cohens_kappa: { type: number, format: double, nullable: true, description: Over pass/fail verdicts }
        percent_agreement: { type: number, format: double, nullable: true }
        pearson: { type: number, format: double, nullable: true, description: Over numeric values }
        mean_abs_error: { type: number, format: double, nullable: true }
        judge_pass_rate: { type: number, format: double, nullable: true }
        human_pass_rate: { type: number, format: double, nullable: true }
        confusion:
          type: object
          description: Human verdict (rows) vs evaluator verdict (columns), pass = positive
          properties: { tp: { type: integer }, fp: { type: integer }, fn: { type: integer }, tn: { type: integer } }
    # ------------------------------------------------------------ suites, gates, triggers
    Severity:
      type: string
      enum: [critical, major, minor]
    ApplyTo:
      type: string
      enum: [final, per_turn, conversation, trace]
    SuiteEvaluator:
      type: object
      required: [evaluator_id]
      properties:
        evaluator_id: { type: string, format: uuid }
        weight: { type: number, format: double, default: 1 }
        threshold: { type: number, format: double, description: "Pass if value >= threshold (0..1)" }
        severity: { $ref: "#/components/schemas/Severity" }
        apply_to: { $ref: "#/components/schemas/ApplyTo" }
        fail_fast: { type: boolean, description: "If this (deterministic) check fails, skip judges for the example" }
    SuiteDataset:
      type: object
      required: [dataset_id]
      properties:
        dataset_id: { type: string, format: uuid }
        version: { type: integer, nullable: true, description: "Pinned version number; null = latest published" }
    Sampling:
      type: object
      properties:
        mode: { type: string, enum: [none, random, stratified], default: none }
        n: { type: integer, minimum: 1 }
        percent: { type: number, format: double, minimum: 0, maximum: 100 }
        seed: { type: integer, format: int64 }
    BaselinePolicy:
      type: object
      properties:
        policy: { type: string, enum: [none, pinned, last_passing], default: last_passing }
        run_id: { type: string, format: uuid, description: "pinned: the baseline run" }
        target_id: { type: string, format: uuid, description: "last_passing: on this target (default: same target)" }
    SuiteConfig:
      type: object
      additionalProperties: true
      x-go-type: json.RawMessage
      properties:
        target_ids: { type: array, items: { type: string, format: uuid }, description: One run per target; several give an automatic comparison }
        datasets: { type: array, items: { $ref: "#/components/schemas/SuiteDataset" } }
        evaluators: { type: array, items: { $ref: "#/components/schemas/SuiteEvaluator" } }
        trials: { type: integer, minimum: 1, maximum: 10, default: 1 }
        sampling: { $ref: "#/components/schemas/Sampling" }
        limits: { $ref: "#/components/schemas/TargetLimits" }
        cache: { type: object, properties: { target: { type: boolean, default: false }, judges: { type: boolean, default: true } } }
        baseline: { $ref: "#/components/schemas/BaselinePolicy" }
        failure_budget:
          type: object
          description: Cancel the run early once any limit is exceeded (unset = unlimited)
          properties:
            critical_failures: { type: integer, minimum: 0, description: Max results with a failed critical evaluator }
            failures: { type: integer, minimum: 0, description: Max failed results }
            errors: { type: integer, minimum: 0, description: Max errored results }
            fail_rate: { type: number, format: double, minimum: 0, maximum: 1, description: Max share of failed results, checked once min_results are in }
            min_results: { type: integer, minimum: 1, default: 50, description: Results needed before fail_rate is checked }
        simulator:
          allOf: [{ $ref: "#/components/schemas/SimulatorConfig" }]
          description: LLM that plays the user in simulated multi-turn examples (`conversation.simulation`)
        timeout_seconds: { type: integer }
        variables: { type: object, additionalProperties: { type: string } }
    Suite:
      type: object
      required: [id, org_id, project_id, name, slug, description, config, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        org_id: { type: string, format: uuid }
        project_id: { type: string, format: uuid }
        name: { type: string }
        slug: { type: string }
        description: { type: string }
        config: { $ref: "#/components/schemas/SuiteConfig" }
        baseline_run_id: { type: string, format: uuid, nullable: true }
        last_run: { $ref: "#/components/schemas/Run" }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    SuiteList:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/Suite" } }
        next_cursor: { type: string, nullable: true }
    SuiteCreate:
      type: object
      required: [name, config]
      properties:
        name: { type: string, minLength: 1 }
        slug: { type: string, pattern: "^[a-z0-9][a-z0-9-]{0,62}$" }
        description: { type: string }
        config: { $ref: "#/components/schemas/SuiteConfig" }
    SuiteUpdate:
      type: object
      properties:
        name: { type: string, minLength: 1 }
        slug: { type: string, pattern: "^[a-z0-9][a-z0-9-]{0,62}$" }
        description: { type: string }
        config: { $ref: "#/components/schemas/SuiteConfig" }
        baseline_run_id: { type: string, format: uuid, nullable: true }
    GateExpr:
      type: object
      x-go-type: json.RawMessage
      description: |
        Gate expression AST (same tree the text form parses to). Logical nodes `and`/`or` (2+ `args`) and `not` (1 arg);
        `cmp` has `cmp` (>=, >, <=, <, ==, !=) and two `args` (calls or numbers); `call` has `func` and `params`;
        `num` has `value`. Evaluators are referenced by their id (a UUID) in the stored AST; clients may send the
        evaluator name or slug and the server rewrites it. Example for
        `mean(faithfulness) >= 0.85 and count(critical_fail) == 0`:
        {op:and,args:[{op:cmp,cmp:">=",args:[{op:call,func:mean,params:[<evaluator id>]},{op:num,value:0.85}]},
        {op:cmp,cmp:"==",args:[{op:call,func:count,params:[critical_fail]},{op:num,value:0}]}]}.
      required: [op]
      properties:
        op: { type: string, enum: [and, or, not, cmp, call, num] }
        args: { type: array, items: { $ref: "#/components/schemas/GateExpr" } }
        cmp: { type: string, enum: [">=", ">", "<=", "<", "==", "!="] }
        func: { type: string, enum: [mean, median, p50, p90, p95, p99, min, max, stddev, sum, pass_rate, count, regression_vs_baseline] }
        params: { type: array, items: { type: string } }
        value: { type: number, format: double }
    Gate:
      type: object
      required: [id, suite_id, name, expr, text, enabled, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        suite_id: { type: string, format: uuid }
        name: { type: string }
        expr: { $ref: "#/components/schemas/GateExpr" }
        text: { type: string, description: Human-readable rendering of expr }
        enabled: { type: boolean }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    GateList:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/Gate" } }
    GateCreate:
      type: object
      description: Send `text` (e.g. `mean(faithfulness) >= 0.85`) or `expr` (the AST); exactly one.
      properties:
        name: { type: string }
        text: { type: string }
        expr: { $ref: "#/components/schemas/GateExpr" }
        enabled: { type: boolean, default: true }
    GateValidateRequest:
      type: object
      properties:
        text: { type: string }
        expr: { $ref: "#/components/schemas/GateExpr" }
    GateValidateResult:
      type: object
      required: [ok]
      properties:
        ok: { type: boolean }
        expr: { $ref: "#/components/schemas/GateExpr" }
        text: { type: string, description: Canonical rendering }
        evaluators: { type: array, items: { type: string }, description: Evaluator names the expression references }
        error: { type: string }
        position: { type: integer, description: Character offset of a text parse error (0-based) }
        suggestion: { type: string }
    GateUpdate:
      type: object
      properties:
        name: { type: string }
        text: { type: string }
        expr: { $ref: "#/components/schemas/GateExpr" }
        enabled: { type: boolean }
    TriggerKind:
      type: string
      enum: [manual, schedule, webhook, api]
    TriggerConfig:
      type: object
      additionalProperties: true
      x-go-type: json.RawMessage
      properties:
        cron: { type: string, description: "schedule: 5-field cron expression" }
        timezone: { type: string, default: UTC }
        target_ids: { type: array, items: { type: string, format: uuid }, description: Override the suite's targets }
        sampling: { $ref: "#/components/schemas/Sampling" }
        trials: { type: integer }
        labels: { $ref: "#/components/schemas/Labels" }
        variables: { type: object, additionalProperties: { type: string } }
        payload_variables: { type: object, additionalProperties: { type: string }, description: "webhook: variable name → JSONPath into the payload (e.g. preview URL)" }
        payload_labels: { type: object, additionalProperties: { type: string }, description: "webhook: label name → JSONPath (e.g. git_sha)" }
    Trigger:
      type: object
      required: [id, suite_id, name, kind, config, enabled, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        suite_id: { type: string, format: uuid }
        name: { type: string }
        kind: { $ref: "#/components/schemas/TriggerKind" }
        config: { $ref: "#/components/schemas/TriggerConfig" }
        enabled: { type: boolean }
        next_fire_at: { type: string, format: date-time, nullable: true }
        last_fired_at: { type: string, format: date-time, nullable: true }
        webhook_url: { type: string, description: "webhook: the URL to POST to" }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    TriggerList:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/Trigger" } }
    TriggerCreate:
      type: object
      required: [kind]
      properties:
        name: { type: string }
        kind: { $ref: "#/components/schemas/TriggerKind" }
        config: { $ref: "#/components/schemas/TriggerConfig" }
        enabled: { type: boolean, default: true }
    TriggerCreated:
      allOf:
        - $ref: "#/components/schemas/Trigger"
        - type: object
          properties:
            webhook_secret: { type: string, description: "webhook: HMAC secret, shown only once" }
    TriggerUpdate:
      type: object
      properties:
        name: { type: string }
        config: { $ref: "#/components/schemas/TriggerConfig" }
        enabled: { type: boolean }

    # ------------------------------------------------------------ runs
    RunStatus:
      type: string
      enum: [queued, running, succeeded, failed, errored, canceled]
      description: succeeded = finished and gates passed (or none); failed = finished with a failing gate
    ResultStatus:
      type: string
      enum: [passed, failed, errored, skipped]
    RunCreate:
      type: object
      required: [suite_id]
      properties:
        suite_id: { type: string, format: uuid }
        target_ids: { type: array, items: { type: string, format: uuid }, description: "Override the suite's targets (one run each)" }
        name: { type: string }
        labels: { $ref: "#/components/schemas/Labels" }
        sampling: { $ref: "#/components/schemas/Sampling" }
        trials: { type: integer, minimum: 1, maximum: 10 }
        baseline_run_id: { type: string, format: uuid }
        variables: { type: object, additionalProperties: { type: string }, description: Target template variable overrides }
        trigger_ref: { type: string, description: "Free-form reference, e.g. CI job URL" }
    RunCreateResponse:
      type: object
      required: [runs]
      properties:
        runs: { type: array, items: { $ref: "#/components/schemas/Run" } }
    RunUpdate:
      type: object
      properties:
        name: { type: string }
        labels: { $ref: "#/components/schemas/Labels" }
    RescoreRequest:
      type: object
      properties:
        evaluator_ids: { type: array, items: { type: string, format: uuid }, description: "Evaluators to apply (default: the suite's current evaluators)" }
    GateResult:
      type: object
      required: [gate_id, passed]
      properties:
        gate_id: { type: string, format: uuid }
        name: { type: string }
        text: { type: string }
        passed: { type: boolean }
        value: { type: number, format: double, nullable: true }
        detail: { type: string }
    RunSummary:
      type: object
      additionalProperties: true
      x-go-type: json.RawMessage
      properties:
        pass_rate: { type: number, format: double }
        mean_score: { type: number, format: double }
        gates: { type: array, items: { $ref: "#/components/schemas/GateResult" } }
        duration_ms: { type: number, format: double }
        throughput_per_min: { type: number, format: double }
        cache_hit_ratio: { type: number, format: double }
        rate_limited_ratio: { type: number, format: double }
        latency_p50_ms: { type: number, format: double }
        latency_p95_ms: { type: number, format: double }
        stopped_early: { type: boolean }
    Run:
      type: object
      required: [id, org_id, project_id, name, trigger_kind, trigger_ref, labels, status, total, completed, failed, errored, cost_usd, tokens_in, tokens_out, error, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        org_id: { type: string, format: uuid }
        project_id: { type: string, format: uuid }
        suite_id: { type: string, format: uuid, nullable: true }
        target_id: { type: string, format: uuid, nullable: true }
        target_version_id: { type: string, format: uuid, nullable: true }
        dataset_version_id: { type: string, format: uuid, nullable: true }
        name: { type: string }
        trigger_kind: { $ref: "#/components/schemas/TriggerKind" }
        trigger_ref: { type: string }
        labels: { $ref: "#/components/schemas/Labels" }
        status: { $ref: "#/components/schemas/RunStatus" }
        total: { type: integer, description: Planned example × trial count }
        completed: { type: integer }
        failed: { type: integer }
        errored: { type: integer }
        started_at: { type: string, format: date-time, nullable: true }
        finished_at: { type: string, format: date-time, nullable: true }
        baseline_run_id: { type: string, format: uuid, nullable: true }
        parent_run_id: { type: string, format: uuid, nullable: true }
        gate_passed: { type: boolean, nullable: true }
        summary: { $ref: "#/components/schemas/RunSummary" }
        cost_usd: { type: number, format: double }
        tokens_in: { type: integer, format: int64 }
        tokens_out: { type: integer, format: int64 }
        error: { type: string }
        created_by: { type: string, format: uuid, nullable: true }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    RunList:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/Run" } }
        next_cursor: { type: string, nullable: true }
    Score:
      type: object
      required: [evaluator_id, label, reason]
      properties:
        evaluator_id: { type: string, format: uuid }
        value: { type: number, format: double, nullable: true, description: Normalized 0..1 }
        label: { type: string }
        passed: { type: boolean, nullable: true }
        reason: { type: string }
        meta: { $ref: "#/components/schemas/JSONObject" }
        latency_ms: { type: number, format: double }
        cost_usd: { type: number, format: double }
    Result:
      type: object
      required: [id, run_id, example_id, example_revision_id, trial, status, output, latency_ms, tokens_in, tokens_out, cost_usd, error, cached, tags, scores, created_at]
      properties:
        id: { type: string, format: uuid }
        run_id: { type: string, format: uuid }
        example_id: { type: string, format: uuid }
        example_revision_id: { type: string, format: uuid }
        trial: { type: integer }
        status: { $ref: "#/components/schemas/ResultStatus" }
        input: { $ref: "#/components/schemas/JSONObject" }
        expected: { $ref: "#/components/schemas/JSONValue" }
        output: { type: string }
        output_json: { $ref: "#/components/schemas/JSONValue" }
        context:
          type: array
          items: { type: string }
          x-go-type: json.RawMessage
        tool_calls:
          type: array
          items: { $ref: "#/components/schemas/ToolCall" }
          x-go-type: json.RawMessage
        trace:
          type: array
          items: { $ref: "#/components/schemas/TraceStep" }
          x-go-type: json.RawMessage
        transcript:
          type: array
          items: { $ref: "#/components/schemas/Message" }
          x-go-type: json.RawMessage
        request: { $ref: "#/components/schemas/JSONValue" }
        response: { $ref: "#/components/schemas/JSONValue" }
        latency_ms: { type: number, format: double }
        ttft_ms: { type: number, format: double, nullable: true }
        tokens_in: { type: integer }
        tokens_out: { type: integer }
        cost_usd: { type: number, format: double }
        error: { type: string }
        cached: { type: boolean }
        tags: { type: array, items: { type: string } }
        scores: { type: array, items: { $ref: "#/components/schemas/Score" } }
        created_at: { type: string, format: date-time }
    ResultList:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/Result" } }
        next_cursor: { type: string, nullable: true }
    Histogram:
      type: object
      required: [edges, counts]
      properties:
        edges: { type: array, items: { type: number, format: double } }
        counts: { type: array, items: { type: integer } }
    RunAggregate:
      type: object
      required: [run_id, metric, slice_key, n]
      properties:
        run_id: { type: string, format: uuid }
        evaluator_id: { type: string, format: uuid, nullable: true, description: Null for run-level metrics }
        metric: { type: string, description: "score | latency_ms | ttft_ms | cost_usd | tokens | pass_rate" }
        slice_key: { type: string, description: '"" for all results, "tag:<tag>" for a per-tag slice' }
        n: { type: integer }
        mean: { type: number, format: double, nullable: true }
        min: { type: number, format: double, nullable: true }
        max: { type: number, format: double, nullable: true }
        p50: { type: number, format: double, nullable: true }
        p90: { type: number, format: double, nullable: true }
        p95: { type: number, format: double, nullable: true }
        p99: { type: number, format: double, nullable: true }
        stddev: { type: number, format: double, nullable: true }
        sum: { type: number, format: double, nullable: true }
        pass_rate: { type: number, format: double, nullable: true }
        histogram: { $ref: "#/components/schemas/Histogram" }
    RunAggregateList:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/RunAggregate" } }
    RunEvent:
      type: object
      description: Payload of one SSE message from /v1/runs/{run}/events
      required: [type, run_id, at]
      properties:
        seq: { type: integer, format: int64 }
        type: { type: string, enum: [run.status, run.progress, result, run.finished] }
        run_id: { type: string, format: uuid }
        at: { type: string, format: date-time }
        data: { $ref: "#/components/schemas/JSONObject" }
    ProjectOverview:
      type: object
      required: [runs_7d, runs_prev_7d, spend_7d_usd, failing_gates]
      properties:
        runs_7d: { type: integer, description: Runs created in the last 7 days }
        runs_prev_7d: { type: integer, description: Runs created in the 7 days before that }
        latest_run: { $ref: "#/components/schemas/Run" }
        latest_pass_rate: { type: number, format: double, nullable: true, description: Pass rate of the latest finished run (0..1) }
        pass_rate_delta: { type: number, format: double, nullable: true, description: Change vs the previous finished run of the same suite }
        avg_score: { type: number, format: double, nullable: true, description: Mean of the latest finished run's evaluator means }
        spend_7d_usd: { type: number, format: double }
        spend_prev_7d_usd: { type: number, format: double }
        failing_gates: { type: integer, description: Suites whose latest finished run failed its gate }
        failing_suites: { type: array, items: { type: object, required: [suite_id, run_id], properties: { suite_id: { type: string, format: uuid }, name: { type: string }, run_id: { type: string, format: uuid } } } }
    TrendMetric:
      type: string
      enum: [pass_rate, score_mean, latency_p50, latency_p95, cost_usd, tokens]
    TrendPoint:
      type: object
      required: [t, value]
      properties:
        t: { type: string, format: date-time }
        value: { type: number, format: double, nullable: true }
        n: { type: integer }
        run_id: { type: string, format: uuid }
    TrendSeries:
      type: object
      required: [key, label, points]
      properties:
        key: { type: string }
        label: { type: string }
        suite_id: { type: string, format: uuid }
        target_id: { type: string, format: uuid }
        evaluator_id: { type: string, format: uuid }
        points: { type: array, items: { $ref: "#/components/schemas/TrendPoint" } }
    Trend:
      type: object
      required: [metric, series]
      properties:
        metric: { $ref: "#/components/schemas/TrendMetric" }
        series: { type: array, items: { $ref: "#/components/schemas/TrendSeries" } }

    # ------------------------------------------------------------ comparisons
    Comparison:
      type: object
      required: [id, project_id, name, run_ids, created_at]
      properties:
        id: { type: string, format: uuid }
        project_id: { type: string, format: uuid }
        name: { type: string }
        run_ids: { type: array, items: { type: string, format: uuid } }
        created_by: { type: string, format: uuid, nullable: true }
        created_at: { type: string, format: date-time }
    ComparisonList:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/Comparison" } }
        next_cursor: { type: string, nullable: true }
    ComparisonCreate:
      type: object
      required: [run_ids]
      properties:
        name: { type: string }
        run_ids: { type: array, minItems: 2, maxItems: 4, items: { type: string, format: uuid } }
    ScorecardCell:
      type: object
      required: [run_id, n]
      properties:
        run_id: { type: string, format: uuid }
        n: { type: integer }
        mean: { type: number, format: double, nullable: true }
        pass_rate: { type: number, format: double, nullable: true }
        delta_mean: { type: number, format: double, nullable: true, description: vs the first run }
        delta_pass_rate: { type: number, format: double, nullable: true }
        ci_low: { type: number, format: double, nullable: true, description: Paired bootstrap interval of the mean delta }
        ci_high: { type: number, format: double, nullable: true }
        p_value: { type: number, format: double, nullable: true }
        significant: { type: boolean, description: The interval excludes zero }
        paired: { type: integer, description: Examples scored in both this run and the baseline }
    ScorecardRow:
      type: object
      required: [key, label, cells]
      properties:
        key: { type: string, description: 'evaluator id or a run-level metric ("latency_p95", "cost_usd")' }
        label: { type: string }
        evaluator_id: { type: string, format: uuid }
        cells: { type: array, items: { $ref: "#/components/schemas/ScorecardCell" } }
    ExampleDeltaCell:
      type: object
      required: [run_id]
      properties:
        run_id: { type: string, format: uuid }
        result_id: { type: string, format: uuid }
        value: { type: number, format: double, nullable: true }
        passed: { type: boolean, nullable: true }
        output: { type: string }
    ComparisonReport:
      type: object
      required: [runs, scorecard, regressions, improvements]
      properties:
        runs: { type: array, items: { $ref: "#/components/schemas/Run" } }
        evaluator_id: { type: string, format: uuid, description: Evaluator used for regressions, improvements, scatter and rows }
        evaluators: { type: array, items: { type: object, required: [id, name], properties: { id: { type: string, format: uuid }, name: { type: string } } }, description: Evaluators present in the baseline and at least one other run }
        against_run_id: { type: string, format: uuid }
        scorecard: { type: array, items: { $ref: "#/components/schemas/ScorecardRow" } }
        regressions: { type: array, items: { $ref: "#/components/schemas/ExampleDelta" } }
        regressions_total: { type: integer }
        improvements: { type: array, items: { $ref: "#/components/schemas/ExampleDelta" } }
        improvements_total: { type: integer }
        scatter: { type: array, items: { type: object, required: [example_id, a, b], properties: { example_id: { type: string, format: uuid }, a: { type: number, format: double }, b: { type: number, format: double } } } }
        rows: { type: array, items: { $ref: "#/components/schemas/ComparisonRow" } }
        rows_total: { type: integer }
        pairwise: { type: array, items: { $ref: "#/components/schemas/PairwiseSummary" }, description: Win rate of each pairwise-scored run, when present }
    ExampleDelta:
      type: object
      required: [example_id, baseline, candidate, delta]
      properties:
        example_id: { type: string, format: uuid }
        input_preview: { type: string }
        baseline: { type: number, format: double }
        candidate: { type: number, format: double }
        delta: { type: number, format: double }
        baseline_passed: { type: boolean, nullable: true }
        candidate_passed: { type: boolean, nullable: true }
    ComparisonRow:
      type: object
      required: [example_id, cells]
      properties:
        example_id: { type: string, format: uuid }
        input_preview: { type: string }
        cells:
          type: array
          description: One per compared run, same order as `runs`; absent value = example not scored in that run
          items:
            type: object
            required: [run_id]
            properties:
              run_id: { type: string, format: uuid }
              value: { type: number, format: double, nullable: true }
              passed: { type: boolean, nullable: true }
    PairwiseSummary:
      type: object
      required: [run_id, wins, ties, losses, win_rate]
      properties:
        run_id: { type: string, format: uuid }
        wins: { type: integer }
        ties: { type: integer }
        losses: { type: integer }
        win_rate: { type: number, format: double, description: (wins + ties/2) / decided }
    # ------------------------------------------------------------ review
    ReviewQueueConfig:
      type: object
      additionalProperties: true
      x-go-type: json.RawMessage
      properties:
        mode: { type: string, enum: [all, failures, sample], default: failures }
        sample_pct: { type: number, format: double, minimum: 0, maximum: 100 }
        scale: { type: object, properties: { min: { type: number, format: double, default: 1 }, max: { type: number, format: double, default: 5 } } }
        pass_fail: { type: boolean, default: true }
        labels: { type: array, items: { type: string } }
        instructions: { type: string }
    ReviewQueue:
      type: object
      required: [id, project_id, name, description, config, pending_count, done_count, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        project_id: { type: string, format: uuid }
        name: { type: string }
        description: { type: string }
        evaluator_id: { type: string, format: uuid, nullable: true, description: Human evaluator whose scores the annotations become }
        config: { $ref: "#/components/schemas/ReviewQueueConfig" }
        pending_count: { type: integer }
        done_count: { type: integer }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    ReviewQueueList:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/ReviewQueue" } }
        next_cursor: { type: string, nullable: true }
    ReviewQueueCreate:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1 }
        description: { type: string }
        evaluator_id: { type: string, format: uuid }
        config: { $ref: "#/components/schemas/ReviewQueueConfig" }
    ReviewQueueUpdate:
      type: object
      properties:
        name: { type: string, minLength: 1 }
        description: { type: string }
        evaluator_id: { type: string, format: uuid, nullable: true }
        config: { $ref: "#/components/schemas/ReviewQueueConfig" }
    ReviewItemStatus:
      type: string
      enum: [pending, in_progress, done, skipped]
    ReviewItem:
      type: object
      required: [id, queue_id, run_id, result_id, status, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        queue_id: { type: string, format: uuid }
        run_id: { type: string, format: uuid }
        result_id: { type: string, format: uuid }
        status: { $ref: "#/components/schemas/ReviewItemStatus" }
        assigned_to: { type: string, format: uuid, nullable: true }
        completed_by: { type: string, format: uuid, nullable: true }
        completed_at: { type: string, format: date-time, nullable: true }
        result: { $ref: "#/components/schemas/Result" }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    ReviewItemList:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/ReviewItem" } }
        next_cursor: { type: string, nullable: true }
    ReviewItemsAdd:
      type: object
      properties:
        result_ids: { type: array, maxItems: 10000, items: { type: string, format: uuid } }
        run_id: { type: string, format: uuid, description: "With `select`: add a run's results" }
        select: { type: string, enum: [all, failures], default: failures }
    ReviewItemUpdate:
      type: object
      properties:
        status: { $ref: "#/components/schemas/ReviewItemStatus" }
        assigned_to: { type: string, format: uuid, nullable: true }
    Annotation:
      type: object
      required: [id, project_id, result_id, label, comment, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        project_id: { type: string, format: uuid }
        result_id: { type: string, format: uuid }
        review_item_id: { type: string, format: uuid, nullable: true }
        user_id: { type: string, format: uuid, nullable: true }
        evaluator_id: { type: string, format: uuid, nullable: true }
        value: { type: number, format: double, nullable: true }
        label: { type: string }
        passed: { type: boolean, nullable: true }
        comment: { type: string }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    AnnotationList:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/Annotation" } }
        next_cursor: { type: string, nullable: true }
    AnnotationCreate:
      type: object
      required: [result_id]
      properties:
        result_id: { type: string, format: uuid }
        review_item_id: { type: string, format: uuid }
        complete_item: { type: boolean, default: true }
        evaluator_id: { type: string, format: uuid }
        value: { type: number, format: double, minimum: 0, maximum: 1 }
        label: { type: string }
        passed: { type: boolean }
        comment: { type: string }
    AnnotationUpdate:
      type: object
      properties:
        evaluator_id: { type: string, format: uuid, nullable: true }
        value: { type: number, format: double, nullable: true, minimum: 0, maximum: 1 }
        label: { type: string }
        passed: { type: boolean, nullable: true }
        comment: { type: string }

    # ------------------------------------------------------------ edition, login providers
    Edition:
      type: object
      required: [edition, features]
      properties:
        edition: { type: string, enum: [community, enterprise] }
        features:
          type: array
          description: Enabled enterprise features
          items: { $ref: "#/components/schemas/EnterpriseFeature" }
    EnterpriseFeature:
      type: string
      enum: [sso, saml, scim, custom_roles, audit_log, retention, branding]
    AuthProvider:
      type: object
      required: [id, kind, name, start_url]
      properties:
        id: { type: string, description: Provider slug }
        kind: { type: string, enum: [oidc, saml] }
        name: { type: string }
        start_url: { type: string, description: "Navigate here to sign in (append ?redirect=/path)" }
    AuthProviderList:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/AuthProvider" } }

    # ------------------------------------------------------------ enterprise: SSO
    RoleRef:
      type: string
      description: A built-in role (owner, admin, editor, viewer) or `custom:<custom role id>`
    RoleMappingRule:
      type: object
      required: [value, role]
      properties:
        value: { type: string, description: Claim / attribute / group value to match (exact, case-insensitive) }
        role: { $ref: "#/components/schemas/RoleRef" }
    SSOProviderConfig:
      type: object
      properties:
        issuer: { type: string, description: "OIDC issuer URL (discovery at /.well-known/openid-configuration)" }
        client_id: { type: string }
        scopes: { type: array, items: { type: string }, description: "Defaults to openid email profile" }
        idp_metadata_url: { type: string, description: SAML IdP metadata URL }
        idp_metadata_xml: { type: string, description: SAML IdP metadata XML (instead of a URL) }
        email_attribute: { type: string, description: "SAML attribute holding the email (default: NameID or the email attribute)" }
        name_attribute: { type: string }
        allowed_domains: { type: array, items: { type: string }, description: "Only these email domains may sign in (empty = any)" }
        role_claim: { type: string, description: "Claim / attribute with groups or roles (e.g. groups)" }
        role_mapping: { type: array, items: { $ref: "#/components/schemas/RoleMappingRule" } }
        default_role: { $ref: "#/components/schemas/Role" }
        jit_provisioning: { type: boolean, description: Create users and memberships on first sign-in }
        sync_roles: { type: boolean, description: "Re-apply role mapping on every sign-in (owners are never changed)" }
    SSOProvider:
      type: object
      required: [id, org_id, slug, kind, name, enabled, config, has_client_secret, redirect_uri, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        org_id: { type: string, format: uuid }
        slug: { type: string }
        kind: { type: string, enum: [oidc, saml] }
        name: { type: string }
        enabled: { type: boolean }
        config: { $ref: "#/components/schemas/SSOProviderConfig" }
        has_client_secret: { type: boolean }
        redirect_uri: { type: string, description: OIDC redirect URI or SAML ACS URL to register with the IdP }
        metadata_url: { type: string, description: SAML SP metadata URL }
        entity_id: { type: string, description: SAML SP entity id }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    SSOProviderCreate:
      type: object
      required: [kind, name, config]
      properties:
        kind: { type: string, enum: [oidc, saml] }
        name: { type: string, minLength: 1, maxLength: 100 }
        slug: { type: string, pattern: "^[a-z0-9][a-z0-9-]{1,62}$" }
        enabled: { type: boolean }
        config: { $ref: "#/components/schemas/SSOProviderConfig" }
        client_secret: { type: string, description: OIDC client secret (write-only, encrypted at rest) }
    SSOProviderUpdate:
      type: object
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        enabled: { type: boolean }
        config: { $ref: "#/components/schemas/SSOProviderConfig" }
        client_secret: { type: string, description: Replaces the client secret; omit to keep it }
    SSOProviderList:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/SSOProvider" } }

    # ------------------------------------------------------------ enterprise: SCIM
    SCIMToken:
      type: object
      required: [id, name, prefix, created_at]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        prefix: { type: string }
        last_used_at: { type: string, format: date-time, nullable: true }
        created_at: { type: string, format: date-time }
    SCIMTokenCreated:
      allOf:
        - { $ref: "#/components/schemas/SCIMToken" }
        - type: object
          required: [token, base_url]
          properties:
            token: { type: string, description: Shown once }
            base_url: { type: string, description: SCIM base URL to configure in the IdP }
    SCIMTokenList:
      type: object
      required: [items, base_url]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/SCIMToken" } }
        base_url: { type: string }
    SCIMSettings:
      type: object
      required: [default_role, group_roles]
      properties:
        default_role: { $ref: "#/components/schemas/Role" }
        group_roles:
          type: array
          description: SCIM group display name → role. The highest built-in role across a user's groups wins.
          items: { $ref: "#/components/schemas/RoleMappingRule" }

    # ------------------------------------------------------------ enterprise: roles
    Permission:
      type: object
      required: [id, resource, action, description]
      properties:
        id: { type: string, description: "resource:action" }
        resource: { type: string }
        action: { type: string }
        description: { type: string }
    BuiltinRole:
      type: object
      required: [role, permissions]
      properties:
        role: { $ref: "#/components/schemas/Role" }
        permissions: { type: array, items: { type: string } }
    CustomRole:
      type: object
      required: [id, key, name, description, permissions, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        key: { type: string }
        name: { type: string }
        description: { type: string }
        permissions: { type: array, items: { type: string } }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    CustomRoleWrite:
      type: object
      required: [name, permissions]
      properties:
        name: { type: string, minLength: 1, maxLength: 64 }
        description: { type: string, maxLength: 500 }
        permissions: { type: array, items: { type: string } }
    RoleCatalog:
      type: object
      required: [permissions, builtin, custom]
      properties:
        permissions: { type: array, items: { $ref: "#/components/schemas/Permission" } }
        builtin: { type: array, items: { $ref: "#/components/schemas/BuiltinRole" } }
        custom: { type: array, items: { $ref: "#/components/schemas/CustomRole" } }
    RoleAssignment:
      type: object
      required: [user_id, role, source, created_at]
      properties:
        user_id: { type: string, format: uuid }
        project_id: { type: string, format: uuid, nullable: true, description: null = org-wide }
        role: { $ref: "#/components/schemas/RoleRef" }
        source: { type: string, enum: [manual, scim, sso] }
        created_at: { type: string, format: date-time }
    RoleAssignmentWrite:
      type: object
      required: [user_id, role]
      properties:
        user_id: { type: string, format: uuid }
        project_id: { type: string, format: uuid, nullable: true }
        role: { $ref: "#/components/schemas/RoleRef" }
    RoleAssignmentList:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/RoleAssignment" } }

    # ------------------------------------------------------------ enterprise: audit, retention, branding
    AuditSettings:
      type: object
      required: [retention_days]
      properties:
        retention_days: { type: integer, minimum: 0, maximum: 3650, description: 0 = keep forever }
    RetentionPolicyWrite:
      type: object
      required: [run_days]
      properties:
        enabled: { type: boolean }
        run_days: { type: integer, minimum: 1, maximum: 3650 }
        keep_baselines: { type: boolean, description: Never delete runs pinned as a suite baseline (default true) }
    RetentionPolicy:
      type: object
      required: [project_id, enabled, run_days, keep_baselines, last_deleted, total_deleted, eligible_runs]
      properties:
        project_id: { type: string, format: uuid }
        enabled: { type: boolean }
        run_days: { type: integer }
        keep_baselines: { type: boolean }
        last_applied_at: { type: string, format: date-time, nullable: true }
        last_deleted: { type: integer }
        total_deleted: { type: integer }
        eligible_runs: { type: integer, description: "Runs the policy would delete now (capped at 1000)" }
    RetentionPolicyList:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/RetentionPolicy" } }
    Branding:
      type: object
      properties:
        product_name: { type: string, maxLength: 40, description: Replaces "airval" in the app chrome }
        logo: { type: string, nullable: true, description: "data: URL (PNG, JPEG, WebP or SVG, ≤ 128 KiB) or null" }
        accent: { type: string, enum: [iris, indigo, ocean, teal, plum], description: Curated accent ramp (default iris) }
