name: e2e

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  playwright:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Detect e2e script
        id: detect
        run: |
          if [ -f web/package.json ] && node -e "process.exit(require('./web/package.json').scripts?.e2e ? 0 : 1)"; then
            echo "has_e2e=true" >> "$GITHUB_OUTPUT"
          else
            echo "No 'e2e' script in web/package.json yet: skipping."
            echo "has_e2e=false" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.detect.outputs.has_e2e == 'true'
        run: make build
      - if: steps.detect.outputs.has_e2e == 'true'
        name: Start airval dev and the mock target
        run: |
          go build -o bin/mocktarget ./tools/mocktarget
          ./bin/mocktarget -addr 127.0.0.1:9090 >mocktarget.log 2>&1 &
          ./bin/airval dev --addr 127.0.0.1:8080 >airval.log 2>&1 &
          for i in $(seq 1 60); do curl -fsS http://127.0.0.1:8080/readyz && exit 0; sleep 1; done
          cat airval.log; exit 1
      - if: steps.detect.outputs.has_e2e == 'true'
        run: npx --prefix web playwright install --with-deps chromium
      - if: steps.detect.outputs.has_e2e == 'true'
        name: Run Playwright
        env:
          AIRVAL_E2E_BASE_URL: http://127.0.0.1:8080
          AIRVAL_E2E_MOCK_TARGET_URL: http://127.0.0.1:9090
        run: npm --prefix web run e2e
      - uses: actions/upload-artifact@v4
        if: always() && steps.detect.outputs.has_e2e == 'true'
        with:
          name: e2e-report
          path: |
            web/playwright-report
            web/test-results
            airval.log
            mocktarget.log
          if-no-files-found: ignore
