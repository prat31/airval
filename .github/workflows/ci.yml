name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  go-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Placeholder web/dist (embedded at compile time)
        run: mkdir -p web/dist && touch web/dist/.gitkeep
      - name: go vet + gofmt
        run: make lint
      - uses: golangci/golangci-lint-action@v8
        with:
          version: v2.6.2

  go-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: airval
          POSTGRES_DB: airval
        ports: ["55432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      AIRVAL_TEST_PG_URL: postgres://postgres:airval@localhost:55432/airval?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Placeholder web/dist (embedded at compile time)
        run: mkdir -p web/dist && touch web/dist/.gitkeep
      - name: Test (SQLite + Postgres contract tests, race detector)
        run: go test -race -count=1 -coverprofile=coverage.out ./...
      - name: Test with enterprise build tag
        run: go test -race -count=1 -tags ee ./...
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: coverage.out
          if-no-files-found: ignore

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm --prefix web ci --no-audit --no-fund
      - run: npm --prefix web run check
      - run: npm --prefix web run build
      - name: Generated API client is up to date
        run: |
          npm --prefix web run gen:api
          git diff --exit-code -- web/src/lib/api || { echo "run 'make gen' and commit"; exit 1; }
      - uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: web/dist
          retention-days: 1

  build:
    needs: [web]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: web/dist
      - name: Build binaries (core and ee)
        run: |
          CGO_ENABLED=0 go build -trimpath -o bin/airval ./cmd/airval
          CGO_ENABLED=0 go build -trimpath -tags ee -o bin/airval-ee ./cmd/airval
      - name: Smoke test
        run: |
          ./bin/airval version
          ./bin/airval dev --addr 127.0.0.1:18080 >dev.log 2>&1 &
          pid=$!
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:18080/readyz && break; sleep 1; done
          curl -fsS http://127.0.0.1:18080/healthz
          curl -fsS http://127.0.0.1:18080/ | grep -qi '<html'
          kill $pid || true
          cat dev.log
      - name: Cross-compile (all release targets)
        run: |
          for t in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64 windows/arm64; do
            GOOS=${t%/*} GOARCH=${t#*/} CGO_ENABLED=0 go build -trimpath -o /dev/null ./cmd/airval
          done
  helm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
        with:
          version: v3.16.4
      - name: Install kubeconform
        run: |
          curl -fsSL https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz | tar -xz kubeconform
          sudo install kubeconform /usr/local/bin/
      - name: Lint, render and validate the chart
        run: deploy/helm/validate.sh

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Build (no push), multi-arch
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: false
          build-args: |
            VERSION=ci-${{ github.sha }}
            COMMIT=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Build amd64 image and run the compose stack
        run: |
          docker build -f deploy/docker/Dockerfile -t airval:ci .
          cd deploy/docker
          printf 'AIRVAL_IMAGE=airval:ci\nPOSTGRES_PASSWORD=ci\nAIRVAL_SECRETS_MASTER_KEY=%s\n' "$(openssl rand -base64 32)" > .env
          docker compose up -d --wait --wait-timeout 180
          curl -fsS http://localhost:8080/readyz
          docker compose logs --no-color | tail -50
          docker compose down -v
